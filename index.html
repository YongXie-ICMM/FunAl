FunAl.register({
  id: 'laststep',
  title: '最后一脚从哪来',
  goal: '学习者亲手把 5 条路线按最后一步分成两堆，双向验证不重不漏，剪掉最后一步后看到两堆正好是两道更小的同类题。',
  minutes: 4,
  async run(t) {
    const D = FunAl.data.ways;
    const fmt = (r) => r.map((k, i) => (i === r.length - 1 ? `<span class="tail">+${k}</span>` : `+${k}`)).join(' ');

    await t.say('一条条数走不通。那换个问法。');
    await t.say('别管一整趟怎么走。**只看最后一脚。**');

    await t.ask.multi('你已经站在第 4 级了。你的**最后一脚**，是从哪一级踩上来的？（可能不止一个答案）', [
      '第 1 级', '第 2 级', '第 3 级', '第 4 级',
    ], {
      correct: [1, 2],
      feedback: (got) => {
        if (got.includes(3)) return '第 4 级就是你现在站的地方。你没法从第 4 级踩到第 4 级——那等于没动。';
        if (got.includes(0)) return '从第 1 级踩到第 4 级要跨 3 级，一脚跨不了那么远。规则是一次最多 2 级。';
        if (got.length === 1 && got[0] === 2) return '第 3 级对，但还有一个。一脚除了走 1 级，还能走几级？';
        if (got.length === 1 && got[0] === 1) return '第 2 级对，但还有一个。一脚除了走 2 级，还能走几级？';
        return '一脚只能走 1 级或 2 级。从第 4 级往回退 1 级、退 2 级，分别是哪两级？';
      },
      explainRight: '对。**只有两种可能：从第 3 级跨 1 级上来，或者从第 2 级跨 2 级上来。** 没有第三种。',
      hints: [
        '从第 4 级往回退。退 1 级到哪？退 2 级到哪？',
        '一脚最多跨 2 级，所以往回最多退 2 级。',
      ],
    });

    await t.say('那就把你刚才找到的 5 条路线，按**最后一脚**分成两堆。');
    const bkBox = t.canvas();
    const bk = FunAl.widgets.buckets(bkBox, {
      cards: D.routes4,
      buckets: ['最后一脚从第 3 级上来（+1）', '最后一脚从第 2 级上来（+2）'],
      format: fmt,
      answer: (r) => (r[r.length - 1] === 1 ? 0 : 1),
      poolLabel: '点一张卡片，再点它该进的筐。橙色的那个数字就是最后一脚。',
      onWrong: (r) => t.wrong(`这条路线的最后一脚是 **+${r[r.length - 1]}**，橙色标出来了。走 +${r[r.length - 1]} 才能上第 4 级的话，你得站在第 ${4 - r[r.length - 1]} 级。`),
    });
    t.hints(['看每张卡片最右边那个橙色的数字，它就是最后一脚。', '最后一脚是 +1 的进左筐，是 +2 的进右筐。']);
    await t.waitFor((resolve) => { bkBox.addEventListener('click', function chk() { if (bk.counts()[0] + bk.counts()[1] === 5) { setTimeout(() => resolve(true), 300); bkBox.removeEventListener('click', chk); } }); });
    t.clearHints();
    t.right(`分完了：左筐 **${bk.counts()[0]} 条**，右筐 **${bk.counts()[1]} 条**。`);

    await t.say('先别急着相加。得先确认这两个筐是**干净**的。两件事要查。');

    await t.ask.choice('第一件：有没有哪条路线，**两个筐都能进**？', [
      '没有。一条路线只有一个最后一脚。',
      '有，有些路线两边都放得下。',
    ], {
      correct: 0,
      feedback: { 1: '找一条试试看。任何一条路线，它的最后一个数字要么是 1，要么是 2，不可能同时是两个。所以它只能进一个筐。' },
      explainRight: '对。所以**没有一条路线被数了两次**。',
      hints: ['随便挑一条卡片，看它最后一个数字。它能同时是 1 又是 2 吗？'],
    });

    await t.ask.choice('第二件，反过来问：有没有哪条到第 4 级的路线，**两个筐都进不去**、被漏掉了？', [
      '没有。任何一条路都得有最后一脚，而最后一脚只能是 +1 或 +2。',
      '可能有，我们只是没找到而已。',
    ], {
      correct: 0,
      feedback: {
        1: '假设真有这么一条被漏掉的路。它总得走到第 4 级吧？那它的最后一脚是几级？只能是 1 或 2。是 1 就该在左筐，是 2 就该在右筐。所以它漏不掉。',
      },
      explainRight: '对。**每条路都有最后一脚，最后一脚只有两种，所以一条也漏不掉。**',
      hints: ['假设真有一条被漏掉的路，它走到第 4 级的最后一脚是几级？', '最后一脚只能是 1 级或 2 级。是 1 就该在左筐，是 2 就该在右筐。哪儿也去不了的路存在吗？'],
    });

    t.note('不重也不漏', '两个筐**没有重复**、也**没有遗漏**。到这一步，两个筐里的数量才可以放心相加。');

    await t.say('现在做一件事：**把每张卡片的最后一脚剪掉。** 看看剩下什么。');
    await t.ask.confirm('剪掉最后一脚');
    bk.cutTails();
    await t.pause(600);

    await t.say('左筐那 3 条，剪掉 +1 之后，剩下的是 **+1+1+1、+1+2、+2+1**——这是三条走到**第 3 级**的路。');
    await t.say('右筐那 2 条，剪掉 +2 之后，剩下的是 **+1+1、+2**——这是两条走到**第 2 级**的路。');

    await t.say('可它们是**全部**吗？左筐剪完只有 3 条，会不会到第 3 级其实有第 4 条路，只是没出现在这儿？自己去找一下。');

    const box3 = t.canvas();
    box3.innerHTML = '<div class="small muted" style="margin-bottom:6px">这是一段 3 级的楼梯。去找第 4 条路。</div>';
    const st3 = FunAl.widgets.stairs(box3, { n: 3, controls: true, emptyHint: '走走看。' });
    const found3 = [];
    const chip3 = FunAl.widgets.routeChips(box3, []);
    const note3 = t.el('div', 'small muted', '找到 0 条');
    box3.appendChild(note3);
    const row3 = t.el('div', 'btn-row');
    const giveUp = t.el('button', 'btn', '找不到第 4 条了');
    row3.appendChild(giveUp);
    box3.appendChild(row3);
    st3.onStep((ev) => {
      if (!ev.done) return;
      const key = ev.path.join('');
      if (found3.some((f) => f.join('') === key)) t.wrong(`**${ev.path.map((k) => '+' + k).join(' ')}** 这条刚走过。`);
      else { found3.push(ev.path.slice()); chip3.add(ev.path.slice()); note3.textContent = `找到 ${found3.length} 条`; }
      setTimeout(() => st3.reset(), 600);
    });
    t.hints(['3 级楼梯，一次 1 级或 2 级。把能想到的都走一遍。', '试试 +1+1+1、+1+2、+2+1。还有第四种吗？']);
    await t.waitFor((resolve) => giveUp.addEventListener('click', () => {
      if (found3.length < 3) { t.wrong(`你才找到 ${found3.length} 条，还没找全呢。到第 3 级至少有 3 条。`); return; }
      giveUp.disabled = true; st3.enable(false); resolve(true);
    }));
    t.clearHints();
    t.learnerSays('找不到第 4 条');
    t.right('找不到，因为**真的只有 3 条**。左筐剪完剩下的那 3 条，就是到第 3 级的全部走法，一条不多一条不少。');

    await t.say('反过来也成立：随便拿一条到第 3 级的路，末尾接上 +1，它就变成一条到第 4 级、最后一脚是 +1 的路。**一对一，两边严丝合缝。**');

    t.note('你自己推出来的', '**到第 4 级的走法数 = 到第 3 级的走法数 + 到第 2 级的走法数**\n\n也就是 **5 = 3 + 2**。\n\n这不是我告诉你的公式，是你把 5 张卡片分了两堆、又剪掉最后一脚看出来的。');

    await t.say('这条规律是你自己看出来的。但先别急着用它——');
    await t.say('刚才我们是按「最后一脚」分的。你可能会想：**为什么偏偏是最后一脚？换个分法行不行？**');
    await t.say('这个问题问得好，而且答案可能跟你想的不一样。下一屏你亲手再分两次。');

    t.done();
  },
});


// ---- src/levels/04_splits.js ----
FunAl.register({
  id: 'splits',
  title: '还有别的分法吗',
  goal: '学习者亲手用另外两种方式分堆，看到「按第一脚分」需要一个额外前提、「按用了几个 2 分」当场崩掉，从而拿到真正的判据。',
  minutes: 3,
  async run(t) {
    const D = FunAl.data.ways;
    const R = D.routes4;
    const chip = (r) => r.map((k) => `+${k}`).join(' ');
    const chipHead = (r) => `<span class="tail">+${r[0]}</span> ` + r.slice(1).map((k) => `+${k}`).join(' ');

    await t.say('上一屏你说「按第一脚分也行」。那就**真的试一次**，别嘴上说说。');

    const b1Box = t.canvas();
    const b1 = FunAl.widgets.buckets(b1Box, {
      cards: R,
      buckets: ['第一脚走 1 级', '第一脚走 2 级'],
      format: chipHead,
      answer: (r) => (r[0] === 1 ? 0 : 1),
      poolLabel: '这次看**开头**那个橙色数字。点卡片，再点筐。',
      onWrong: (r) => t.wrong(`这条路线的第一脚是 **+${r[0]}**，橙色标出来了。`),
    });
    t.hints(['这次看每张卡片最**左边**那个橙色数字。']);
    await t.waitFor((resolve) => { const iv = setInterval(() => { if (b1.counts()[0] + b1.counts()[1] === 5) { clearInterval(iv); setTimeout(() => resolve(true), 400); } }, 150); });
    t.clearHints();
    t.right(`**${b1.counts()[0]} 条 + ${b1.counts()[1]} 条 = 5 条。** 不重不漏，跟按最后一脚分一样干净。`);

    await t.say('那把第一脚也剪掉，看剩下什么。');
    await t.ask.confirm('剪掉第一脚');
    b1.cutTails();
    await t.pause(600);

    const leftBox = t.canvas();
    leftBox.innerHTML = `<div class="small muted" style="margin-bottom:8px">左筐剪掉第一脚之后，剩下这 3 条</div>`;
    FunAl.widgets.routeChips(leftBox, [[1, 1, 1], [1, 2], [2, 1]]);

    await t.ask.choice('这 3 条，是「到第 3 级」的全部走法吗？', [
      '不完全是。它们是「**从第 1 级**走到第 4 级」的走法，起点不一样。',
      '是的，一模一样。',
    ], {
      correct: 0,
      feedback: {
        1: '看仔细：剪掉第一脚之后，人已经站在**第 1 级**了，剩下的路是从第 1 级走到第 4 级。「到第 3 级」说的是从**地面**出发。起点不同。',
      },
      explainRight: '对。起点变了。',
      hints: ['剪掉第一脚之后，人站在哪一级？', '「到第 3 级」是从哪里出发的？'],
    });

    await t.ask.choice('那它们算不算「同一道题」？', [
      '算，但要多说一句：因为这段楼梯每一级都长得一样，从第 1 级往上走 3 级，跟从地面往上走 3 级完全一回事。',
      '不算，起点不一样就是两道题。',
    ], {
      correct: 0,
      feedback: {
        1: '这段楼梯上确实是一回事——台阶没有编号差别，从哪儿起步都一样。所以按第一脚分**在这道题上能用**。只是你得先说这句话。',
      },
      explainRight: '对。**能用，但多了一个前提：每级台阶都一样。**',
      hints: ['这段楼梯上，第 1 级和地面有什么区别吗？'],
    });

    t.note('两种分法都能走通', '按**最后一脚**分，剪完剩下的是「从地面到第 3 级」——**原题本身**，不用多说任何话。\n\n按**第一脚**分，剪完剩下的是「从第 1 级到第 4 级」。在这段楼梯上它和原题是一回事，因为台阶都一样。\n\n那要是台阶**不一样**呢（比如后面那道每级价钱都不同的楼梯）？照样能走通——只是格子里写的东西要跟着改：不再是「从地面到第 k 级」，而是「**从第 k 级出发到终点**最少要多少」，表从右往左填。\n\n**两种是一体两面，都对。** 这门课统一用最后一脚，只是因为那样格子的编号就是楼层号，读起来顺一点。');

    await t.say('再试第三种分法：**按这条路用了几个「2 级」来分。**');

    const b2Box = t.canvas();
    const b2 = FunAl.widgets.buckets(b2Box, {
      cards: R,
      buckets: ['一个 2 都没用', '用了 1 个 2', '用了 2 个 2'],
      format: chip,
      answer: (r) => r.filter((k) => k === 2).length,
      poolLabel: '数一数每张卡片里有几个 2。',
      onWrong: (r) => t.wrong(`这条是 ${chip(r)}，里面有 **${r.filter((k) => k === 2).length} 个 2**。`),
    });
    t.hints(['数卡片上有几个「+2」。']);
    await t.waitFor((resolve) => { const iv = setInterval(() => { if (b2.counts().reduce((a, b) => a + b, 0) === 5) { clearInterval(iv); setTimeout(() => resolve(true), 400); } }, 150); });
    t.clearHints();
    t.right(`**${b2.counts().join(' + ')} = 5 条。** 又是不重不漏。三种分法，三次都干净。`);

    await t.say('那问题来了：**干净就够了吗？**');
    await t.say('把中间那个筐（用了 1 个 2）拿出来，把那个 2 剪掉，看剩下什么。');
    await t.ask.confirm('把那个 2 剪掉');

    const collapseBox = t.canvas();
    collapseBox.innerHTML = `
      <div class="small muted" style="margin-bottom:8px">剪之前</div>
      <div class="w-chips">${[[1, 1, 2], [1, 2, 1], [2, 1, 1]].map((r) => `<div class="w-chip">${chip(r)}</div>`).join('')}</div>
      <div class="small muted" style="margin:14px 0 8px">剪掉那个 2 之后</div>
      <div class="w-chips">${[0, 1, 2].map(() => `<div class="w-chip dup">+1 +1</div>`).join('')}</div>`;
    await t.pause(800);

    await t.ask.choice('三张**不一样**的卡片，剪完变成了三张**一模一样**的卡片。而到第 2 级一共只有 2 条走法（+1+1 和 +2）。这说明什么？', [
      '说明这堆的数量（3）跟「到第 2 级的走法数」（2）对不上。剪完之后不是一一对应，套不下去了。',
      '说明剪错了，应该剪别的位置。',
      '说明这种分法也可以，只是麻烦一点。',
    ], {
      correct: 0,
      feedback: {
        1: '「用了 1 个 2」这个筐里，那个 2 可能在开头、中间、结尾。你剪哪一个？不管剪哪个，剩下的都不是一道「从地面到第几级」的题。',
        2: '不是麻烦，是**根本接不下去**。到第 2 级只有 2 条路，可这个筐有 3 条。你没法说「这个筐的数量 = 到第 2 级的走法数」，那这一步就白拆了。',
      },
      explainRight: '对。**分得干净，不代表能接着往下拆。**',
      hints: [
        '数一数：剪完剩下 3 张卡。可到第 2 级一共有几条走法？',
        '3 对 2，对不上。那你还能说「这个筐的数量等于某道小题的答案」吗？',
      ],
    });

    t.note('这才是真正的判据', '分法可以有很多种，**能用的只有一种**：\n\n**剪掉那一步之后，剩下的必须还是同一道题，只是数字更小；而且原来的卡片和剩下的卡片要一一对应，不多不少。**\n\n· 按最后一脚分 → 剩下「从地面到第 3 级」，**原题本身**。✓\n· 按第一脚分 → 剩下「从第 1 级到第 4 级」，得先说「台阶都一样」。这题行，别的题不一定。\n· 按用了几个 2 分 → 剩下的根本不是「到第几级」这种题。✗\n\n**「看最后一步」之所以到处都灵，就是因为它剪完永远落回原题。**');

    await t.say('判据有了。下一屏回到正题：用这条规律一路往上算——但要先填一个很多人会填错的格子。');
    t.done();
  },
});


// ---- src/levels/05_boundary.js ----
FunAl.register({
  id: 'boundary',
  title: '第 0 级填几',
  goal: '让学习者用刚推出的规律反推出「到第 0 级 = 1」，而不是被告知；并用规律算到第 6 级，跟开场的猜测对账。',
  minutes: 3,
  async run(t) {
    const D = FunAl.data.ways;

    await t.say('你手上现在有一条规律：\n\n**到第 k 级的走法数 = 到第 k−1 级的走法数 + 到第 k−2 级的走法数**');
    await t.say('把你已经**亲手数出来**的数字先摆好。下面每一格就是一级台阶，格子里写「从地面走到这一级，有几种走法」。');

    const box = t.canvas();
    const row = FunAl.widgets.cells(box, {
      n: 6,
      label: (i) => (i === 0 ? '地面' : `第 ${i} 级`),
      values: { 1: 1, 2: 2, 3: 3, 4: 5 },
      title: '每一级：有几种走法',
    });
    row.setSub(1, '数出来的'); row.setSub(2, '数出来的'); row.setSub(3, '数出来的'); row.setSub(4, '数出来的');

    await t.say('第 1 到第 4 级你都数过了。现在从第 5 级往上，可以直接用规律算——**但先看看最左边那一格。**');
    await t.say('地面那一格，写的是「从地面走到地面，有几种走法」。');

    row.mark(0, 'active');
    await t.ask.number('地面那一格，填几？', {
      answer: 1,
      unit: ' 种',
      button: '填上',
      feedback: (v) => {
        if (v === 0) {
          return '很多人都填 0，理由是「我一步都没走」。听起来很有道理，但我们**检查一下**。\n\n你刚推出的规律说：**到第 2 级 = 到第 1 级 + 到地面**。到第 1 级是 1，地面按你填的是 0，那到第 2 级就该是 **1 + 0 = 1** 种。\n\n可你上一屏亲手数过，到第 2 级有 **2 种**（+1+1 和 +2）。对不上。\n\n那地面这一格得填几，才能让 1 + ? = 2？';
        }
        if (v === 2) return '2 的话，到第 2 级就成了 1 + 2 = 3 种。可你亲手数出来是 2 种。再调一下。';
        if (v < 0) return '走法数不会是负的。它是「有几条路」，最少也是 0 条。';
        return `填 ${v} 的话，到第 2 级就成了 1 + ${v} = ${1 + v} 种。可你亲手数出来是 **2 种**。要让 1 + ? = 2，问号得是几？`;
      },
      hints: [
        '别凭感觉。用规律去卡它：到第 2 级 = 到第 1 级 + 到地面。',
        '到第 1 级是 1，到第 2 级你数出来是 2。那么 1 + ? = 2。',
      ],
    });
    row.set(0, 1, 'given');
    row.setSub(0, '逼出来的');
    row.clearMarks();

    t.right('**1。** 注意这个 1 不是我告诉你的，也不是背来的——是你用自己推出的规律，反过来把它逼出来的。');

    await t.say('那它是什么意思？「从地面走到地面」有 1 种走法：**一步都不走**。');
    await t.say('就像「什么都不买」也算一种买法。空着的那一趟，也是一趟。');

    t.note('起步格怎么定（这条以后每道题都要用）', '起步格不是背下来的。**把规律往下多套一格，看这一格必须填几，才对得上你亲手数出来的结果。**\n\n后面换了题目，起步格的数字会变（有时是 0，有时是 1）。每次都用这个办法逼一次，就不会记混。');

    await t.say('好，规律有了，起步格也定了。往上算吧。');

    row.links(5, [4, 3], ['+1', '+2']);
    t.hints(['看第 5 级左边那两条弧线，它们指向第 4 级和第 3 级。', '第 4 级是 5 种，第 3 级是 3 种。把这两个数加起来。']);
    await row.fill(5, {
      answer: D.table[5],
      onWrong: (v) => {
        const a = D.table[4], b = D.table[3];
        if (v === a + b + 1) t.wrong(`比正确答案多了 1。这一屏不用加「最后一步」本身——最后一步不制造新走法，它只是把两堆合起来。`);
        else if (v === a) t.wrong(`${a} 是「到第 4 级」那一格的数字。到第 5 级要把**两格**加起来：第 4 级的 ${a}，加上第 3 级的 ${b}。`);
        else if (v === a * b) t.wrong(`这里是相加不是相乘。两堆路线摆在一起，总数是 ${a} 条加 ${b} 条。`);
        else t.wrong(`不对。看上面那两条弧线：到第 5 级只能从第 4 级跨 1 级上来，或者从第 3 级跨 2 级上来。把这两格的数字加起来。`);
      },
      onRight: () => { row.markLink(4, 'pick'); row.markLink(3, 'pick'); t.right(`**${D.table[4]} + ${D.table[3]} = ${D.table[5]}**`); },
    });
    t.clearHints();
    await t.pause(1500);          // let the two chosen arcs stay lit for a moment

    row.clearLinks();
    row.links(6, [5, 4], ['+1', '+2']);
    t.hints(['到第 6 级的最后一脚，是从第 5 级跨 1 级，还是从第 4 级跨 2 级。', '第 5 级是 8 种，第 4 级是 5 种。']);
    await row.fill(6, {
      answer: D.table[6],
      onWrong: (v) => t.wrong(v === D.table[5] + D.table[3]
        ? '加错了一格。到第 6 级的两个来源是第 5 级和第 4 级，不是第 5 级和第 3 级。'
        : `不对。到第 6 级 = 到第 5 级（${D.table[5]}）+ 到第 4 级（${D.table[4]}）。`),
      onRight: () => { row.markLink(5, 'pick'); row.markLink(4, 'pick'); },
    });
    t.clearHints();
    await t.pause(1500);
    row.clearLinks();

    const bet = t.recallOne({ screen: 'hook', kind: 'number' });
    t.right(`**到第 6 级：${D.table[6]} 种。**`);
    if (bet) {
      const diff = Number(bet.answer) - D.table[6];
      await t.say(`回头看一眼：开场你押的是 **${bet.answer} 种**，真实答案是 **${D.table[6]} 种**。`
        + (diff === 0 ? '\n\n你押中了。不过重点不是押中，是你现在**知道为什么**是 13。'
          : `\n\n差了 ${Math.abs(diff)}。没关系——重点是这个 13 不是猜的，是你一格一格算出来的。`));
    }

    await t.ask.predict('顺便看一眼这一整排数字：1、1、2、3、5、8、13。你见过它吗？', [
      '见过，好像有个名字',
      '没见过',
    ]);
    await t.say('它叫**斐波那契数列**。你要是认出来了，那你眼力不错——我们没打算瞒着你。');
    await t.say('不过名字不重要。重要的是：这串数不是查来的，是你从「最后一脚只有两种」一路推出来的。**换一道题，规律就变了，但推的办法不变。**');

    t.note('停一下，你刚才做了什么', '你把一整排格子从左往右填满了，每一格都用它左边两格算出来。\n\n这条路叫**从下往上算**。它很自然——但它不是大多数人的第一反应。');

    await t.say('大多数人拿到那条规律，第一反应是**反过来问**：\n\n「到第 6 级？那我得先知道第 5 级和第 4 级。到第 5 级？那我得先知道第 4 级和第 3 级……」一路往下问。');
    await t.say('写代码的人尤其会这样，因为规律本来就是那么写的：它把大的用小的表示。');
    await t.say('下一屏，你亲手当一次那台**从上往下问**的机器。你会发现一点问题。');

    t.done();
  },
});


// ---- src/levels/06_naive.js ----
FunAl.register({
  id: 'naive',
  title: '一台没记性的机器',
  goal: '学习者亲手把「从上往下问」的过程展开，亲眼看到同一道小题被反复问，并感受到楼梯变高时的爆炸。',
  minutes: 3,
  async run(t) {
    const D = FunAl.data.ways;

    await t.say('现在你来当那台机器。');
    t.note('这台机器的规矩（先说清楚，全程不变）', '**一、** 它只会一条规律：到第 k 级 = 到第 k−1 级 + 到第 k−2 级。\n\n**二、** 它知道两件事不用问：到第 1 级是 1 种，到地面是 1 种。\n\n**三、** 它**没有记性**。刚算过的答案，转头就忘。要用就得重新问一遍。\n\n屏幕上每出现一张卡片，就代表**它问了一道小题**。计数器数的就是卡片张数，从头到尾都是这个意思。');

    await t.ask.predict('先押一个数：为了算出「到第 6 级有几种」，这台机器一共会问出多少张卡片？', [
      '十来张吧',
      '二十几张',
      '上百张',
    ]);

    await t.say('自己点点看。点一张卡片，它就裂成它要问的那两道小题。**橙色**的卡片表示：这道题以前已经出现过了。');

    const box = t.canvas();
    const tr = FunAl.widgets.tree(box, { root: 6, memo: false, label: (n) => `到第 ${n} 级？` });

    const row = t.el('div', 'btn-row');
    const allBtn = t.el('button', 'btn', '够了，剩下的自动展开');
    row.appendChild(allBtn);
    box.appendChild(row);
    allBtn.addEventListener('click', () => { tr.expandAll(); });

    t.hints([
      '点任何一张还是蓝色的卡片，它就会裂开。',
      '一直点到没有蓝色卡片为止。橙色的是你以前见过的题。',
      '嫌慢就按「够了，剩下的自动展开」。',
    ]);
    await t.waitFor((resolve) => tr.on((ev) => { if (ev.kind === 'solved' && ev.n === 6) setTimeout(() => resolve(true), 400); }));
    t.clearHints();
    allBtn.disabled = true;

    const st = tr.stats;
    t.learnerSays(`展开完了：${st.cards} 张卡片`);
    t.right(`**${D.naive[6].cards} 张卡片**，其中 **${st.dupCount} 张**是以前出现过的重复问题。它们全被重新算了一遍。`);

    await t.say('找一找那些橙色卡片。「**到第 2 级？**」这一道，它一共问了 **5 遍**，每一遍都从头重算，每一遍答案都是 2。');
    await t.say('它不是笨，它只是**没记性**。规律本身没问题，问题出在照着规律往下问的时候，同一道小题会一次次冒出来。');

    t.note('给这件事起个名字', '同一道小题被反复问到，叫**重复子问题**。\n\n这个词你现在可以记，因为你刚才亲眼数过那些橙色卡片。');

    await t.say('6 级楼梯还好，25 张而已。楼梯高一点会怎样？自己拉一下。');

    const sBox = t.canvas();
    sBox.innerHTML = '<div class="small muted" style="margin-bottom:10px">楼梯有多高？</div>';
    const sl = t.el('input');
    sl.type = 'range'; sl.min = '6'; sl.max = '30'; sl.value = '6'; sl.step = '1';
    sl.style.cssText = 'width:100%;';
    const out = t.el('div', '', '');
    sBox.append(sl, out);
    const paint = () => {
      const n = Number(sl.value);
      const cards = 2 * D.table[n] - 1;   // always: one card per node of the tree
      const secs = cards;
      const human = secs < 90 ? `${secs} 秒`
        : secs < 5400 ? `${Math.round(secs / 60)} 分钟`
        : secs < 172800 ? `${(secs / 3600).toFixed(1)} 小时`
        : secs < 5184000 ? `${Math.round(secs / 86400)} 天`
        : `${(secs / 2592000).toFixed(1)} 个月`;
      out.innerHTML = `<div style="font-size:1.1rem;margin-top:10px">
        <div>楼梯 <strong>${n}</strong> 级 · 答案是 <strong>${D.table[n].toLocaleString('en-US')}</strong> 种走法</div>
        <div style="margin-top:6px">这台没记性的机器要问 <strong style="color:var(--warn);font-size:1.4rem">${cards.toLocaleString('en-US')}</strong> 张卡片</div>
        <div class="small muted" style="margin-top:4px">一秒问一张的话，要问 ${human}</div>
        <div class="small" style="margin-top:8px;color:var(--ok)">可是真正**不同**的小题，从头到尾只有 ${n + 1} 道（到地面、到第 1 级……到第 ${n} 级）</div>
      </div>`;
      out.innerHTML = out.innerHTML.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    };
    sl.addEventListener('input', paint);
    paint();

    t.hints(['把滑块一路拉到最右边（30 级）看看。']);
    await t.ask.confirm('我拉到 30 级看过了');
    t.clearHints();

    await t.say(`30 级楼梯：答案是 **${D.table[30].toLocaleString('en-US')}** 种，而这台机器要问 **${D.naive[30].cards.toLocaleString('en-US')}** 张卡片——一秒一张要问一个月。`);
    await t.say('可**真正不同的小题只有 31 道**。');

    await t.ask.choice('那问题到底出在哪？', [
      '出在它把同一道题算了无数遍。不同的题其实很少。',
      '出在那条规律不对，得换一条规律。',
      '出在楼梯太高了，这种题就是没法算。',
    ], {
      correct: 0,
      feedback: {
        1: '规律是你自己验证过的，它没错——你用它算出了 13，和亲手数的一致。错的不是规律，是使用规律的方式。',
        2: '30 级楼梯只有 31 道不同的小题，这一点也不多。所以不是题太大，是同一道题被算了太多遍。',
      },
      explainRight: '对。**要算的东西很少，重复的劳动很多。**',
      hints: ['比一比两个数：要问 269 万张卡片，可不同的小题只有 31 道。', '那 269 万张卡片里，绝大多数是同一批题反复出现。'],
    });

    await t.say('那修起来就很自然了：**算过的，记下来。**');
    await t.say('下一屏，你给这台机器一个账本。');

    t.done();
  },
});


// ---- src/levels/07_memo.js ----
FunAl.register({
  id: 'memo',
  title: '给它一个账本',
  goal: '学习者亲手用账本重跑一遍，看到真正需要算的小题只有几道，并理解「记下来」为什么可信。',
  minutes: 3,
  async run(t) {
    const D = FunAl.data.ways;

    await t.say('同一台机器，同一道题。这次桌上多了一个**账本**。');
    t.note('新规矩（只加了一条）', '每碰到一道小题，**先翻账本**：\n\n· 账本上有 → 直接抄，不再往下拆。\n· 账本上没有 → 拆开算，算出来**记进账本**。');

    await t.ask.choice('先想一个问题：账本上的旧答案，凭什么可以直接拿来用？万一它过期了呢？', [
      '不会过期。「到第 2 级有几种走法」这道题的答案是固定的，问一百遍都是 2。',
      '有可能过期，所以最好还是重算一遍保险。',
    ], {
      correct: 0,
      feedback: {
        1: '想想这道小题到底问的是什么：「从地面走到第 2 级，一共有几种走法」。这句话里没有任何会变的东西——楼梯没变，规则没变。答案昨天是 2，今天还是 2。**会变的答案才需要重算，这个不会。**',
      },
      explainRight: '对。**同一道题，答案不会变**，所以抄旧答案是安全的。这一点后面还会用到。',
      hints: ['把那道小题完整念一遍：「从地面走到第 2 级有几种走法」。这句话里有什么东西会变吗？'],
    });

    await t.ask.predict('那么，为了算出到第 6 级，这次它真正需要**算**的小题有几道？', [
      '还是二十几道', '十来道', '五六道',
    ]);

    await t.say('自己点。绿色的卡片表示「账本上有，直接抄的」。');

    const side = t.canvas();
    side.classList.add('w-side');
    const treeBox = t.el('div', 'w-side-main');
    const bookBox = t.el('div', 'w-side-aside');
    side.append(treeBox, bookBox);
    const book = FunAl.widgets.notebook(bookBox, { title: '账本', rows: [2, 3, 4, 5, 6], label: (k) => `到第 ${k} 级` });
    const tr = FunAl.widgets.tree(treeBox, { root: 6, memo: true, book, label: (n) => `到第 ${n} 级？` });

    t.hints(['点蓝色卡片拆开算，点绿色卡片直接抄账本。', '每算出一个答案，右边的账本就会自己记上。']);
    await t.waitFor((resolve) => tr.on((ev) => { if (ev.kind === 'solved' && ev.n === 6) setTimeout(() => resolve(true), 400); }));
    t.clearHints();

    const st = tr.stats;
    t.learnerSays(`算完了，答案还是 ${tr.value}`);
    t.right(`真正算过的小题：**${st.distinctComputed} 道**。屏幕上一共 **${st.cards} 张**卡片，上一屏是 **${D.naive[6].cards} 张**。`);

    await t.say('注意看那 5 道题是哪几道：**到第 2、3、4、5、6 级**。就是账本上那 5 行。');

    t.note('一个容易被追问的细节', `「真正算过的小题有几道」这个数字，**跟你点卡片的顺序没关系**——不管你先点哪一边，需要算的小题永远是那 5 道，因为不同的小题就只有那么多。\n\n（「抄了几次」倒是会随顺序变，所以我们不拿它当数据。）`);

    await t.say(`楼梯高了也一样。30 级楼梯：没有账本要问 **${D.naive[30].cards.toLocaleString('en-US')}** 张卡片，有账本只需要算 **${D.memoComputes[30]}** 道小题。`);

    t.note('给这件事起个名字', '**把算过的答案记下来，下次直接用，这叫「记忆化」。**\n\n就是备忘录的意思。你刚才做的就是它，不多不少。');

    await t.say('现在停下来比较一下两屏。');
    await t.ask.choice('加了账本之后，**那条规律**变了吗？', [
      '没变。规律一模一样，只是不再重复算了。',
      '变了，现在是一条新规律。',
    ], {
      correct: 0,
      feedback: { 1: '把两屏的卡片对照看看：拆的方式完全一样，都是「到第 k 级 = 到第 k−1 级 + 到第 k−2 级」。变的只是**碰到算过的题时不再往下拆**。' },
      explainRight: '对。**想法没变，只是不再做重复劳动。**',
    });

    await t.say('最后一件事。你有没有注意到，账本是**从小到大**填满的？先有到第 2 级，才有第 3 级，最后才轮到第 6 级。');
    await t.ask.choice('既然答案总是从小往大写进账本，那……', [
      '那干脆一开始就从小往大算，连问都不用问。',
      '不行，必须先从大的问下来才知道要算哪些。',
    ], {
      correct: 0,
      feedback: { 1: '这一道题里，你其实一开始就知道要算哪些：从第 2 级到第 6 级，一个不落。既然都要算，那从哪头开始都行。' },
      explainRight: '对。而**这正是你在「第 0 级填几」那一屏已经做过的事**——你从左往右把一排格子填满了。',
      hints: ['回想一下你填那一排格子的时候，是从哪一头开始的？'],
    });

    t.note('两条路，同一本账', '**从上往下问 + 账本**（刚才这屏）和**从下往上填表**（填格子那屏），算出来的是同一批数字。\n\n那平时用哪个？\n\n· **填表**更省事，不用记账本、不用递归，代价是**每一格都得填**。\n· **从上往下问 + 账本**在「格子很多、但真正用得到的很少」的时候更划算——用不到的它压根不会去算。\n\n这门课后面走**填表**这条路，因为它看得见、摸得着。');

    await t.say('到这里，爬楼梯这道题你已经彻底做完了。下一屏，我们给你做过的每一件事起个名字——然后换一道**完全不同**的题试试。');
    t.done();
  },
});


// ---- src/levels/08_naming.js ----
FunAl.register({
  id: 'naming',
  title: '给做过的事起名字',
  goal: '把学习者已经做过的五件事命名，解释符号怎么读，并说清「动态规划」这个名字的来历。',
  minutes: 3,
  async run(t) {
    const D = FunAl.data.ways;

    await t.say('到现在为止，我一个术语都没用。因为术语是**给做过的事贴标签**，事没做过，标签就只是四个字。');
    await t.say('你已经做完了。现在贴标签。');

    await t.ask.match('把左边的名字，连到右边你真正做过的那件事：', [
      { term: '**状态**', did: '每个格子代表的那道小题：「到第 k 级有几种走法」', explain: '对。**状态**就是「我在算哪一道小题」。' },
      { term: '**状态转移**', did: '一格是怎么由左边两格算出来的：到第 k 级 = 到第 k−1 级 + 到第 k−2 级', explain: '对。**转移**就是那条规律：大格子怎么从小格子来。' },
      { term: '**边界**', did: '不用算就知道答案的那一两格，比如地面那格 = 1', explain: '对。**边界**就是起步格。' },
      { term: '**记忆化**', did: '算过的答案记进账本，下次碰到直接抄', explain: '对。**记忆化**就是那个账本。' },
      { term: '**递推（填表）**', did: '从最小的格子开始，从左往右把一整排格子填满', explain: '对。**递推**就是从小往大填。' },
    ], {
      rightOrder: [2, 4, 0, 3, 1],
      feedback: (term, did) => `「${term.replace(/\*/g, '')}」说的不是这件事。先看右边这句话描述的是你在哪一屏做的动作，再想哪个名字对得上。`,
      hints: [
        '先挑你最有把握的一个连上，剩下的会好办很多。',
        '「边界」和「记忆化」这两个最好认：一个是起步格，一个是账本。',
      ],
    });

    await t.say('五个词，五件你亲手做过的事。**没有一个是新东西。**');

    await t.ask.choice('顺带解释一个奇怪的词：为什么把「我在算哪道小题」叫作「**状态**」？', [
      '因为它说的是你此刻的处境。在这道题里，你的处境只有一件事：你站在第几级。',
      '因为它会变来变去，所以叫状态。',
    ], {
      correct: 0,
      feedback: { 1: '变来变去的东西多了去了。「状态」这个词讲究的是**处境**：站在第 4 级的你，和站在第 5 级的你，处境不一样，往后的走法数也不一样。' },
      explainRight: '对。**状态 = 你此刻的处境。** 在这道题里，处境只用一个数字就说清了：你在第几级。\n\n记住这句话，它在后面会变得非常关键。',
      hints: ['把「状态」两个字换成「处境」再读一遍那句话。'],
    });

    await t.say('还有一件事得说清楚，不然你看别人写的东西会被吓到：**符号**。');

    const box = t.canvas();
    const row = FunAl.widgets.cells(box, {
      n: 6, label: (i) => (i === 0 ? '地面' : `第 ${i} 级`),
      values: { 0: D.table[0], 1: D.table[1], 2: D.table[2], 3: D.table[3], 4: D.table[4], 5: D.table[5], 6: D.table[6] },
      title: '你填出来的那排格子',
    });

    t.note('括号不是乘法', '别人写 **f(4)** 或者 **dp[4]** 的时候，那个括号（或方括号）**不是乘号**。\n\n它就是「第 4 格」的意思。**f(4) 念作「第 4 格里的那个数」。**\n\n`f(4)`、`dp[4]`、「到第 4 级有几种走法」——这三种写法说的是同一个东西。\n\n还有一件小事：有人写 `dp[i]`，有人写 `f(k)`，有人写 `a[n]`。**那个字母是谁完全无所谓**，它只是「第几格」里的「几」。看到不认识的字母，就在心里念成「第几」。');

    let picked = false;
    row.pickable((i, it) => {
      if (picked) return;
      if (i !== 4) {
        it.v.classList.add('bad-flash');
        setTimeout(() => it.v.classList.remove('bad-flash'), 400);
        t.wrong(`你点的是第 ${i} 格。f(4) 里的 4 就是格子的编号，所以要点第 4 格。`);
        return;
      }
      picked = true;
      row.pickable(null);
      row.mark(4, 'good');
      t.learnerSays('点了第 4 格');
      t.record({ kind: 'pick', prompt: 'f(4) 是哪一格', answer: '第 4 格', correct: true });
    });
    await t.say('那你来指一下：**f(4)** 说的是哪一格？直接点它。');
    t.hints(['f(4) 里的那个 4，就是格子的编号。']);
    await t.waitFor((resolve) => { const iv = setInterval(() => { if (picked) { clearInterval(iv); resolve(true); } }, 120); });
    t.clearHints();
    t.right(`对，第 4 格，里面写着 **${D.table[4]}**。所以 **f(4) = ${D.table[4]}**。`);

    await t.ask.choice('那你自己推出来的那条规律，用这套写法写出来是哪一个？', [
      'f(k) = f(k−1) + f(k−2)',
      'f(k) = f(k−1) × f(k−2)',
      'f(k) = f(k) + 1',
    ], {
      correct: 0,
      feedback: {
        1: '你是把两堆路线**摆在一起数总数**，不是配对组合。摆在一起就是相加。',
        2: '这句话是「第 k 格等于它自己加 1」，那就永远算不出来了。等号右边只能出现**比 k 小**的格子。',
      },
      explainRight: '对。**f(k) = f(k−1) + f(k−2)**，读作：「第 k 格里的数，等于第 k−1 格加上第 k−2 格。」\n\n这一行你早就会了，只是现在它换了身衣服。',
      hints: ['f(k−1) 就是「第 k−1 格」，也就是当前格左边那一格。', '你填格子的时候做的是加法还是乘法？'],
    });

    await t.say('最后说说「**动态规划**」这四个字。很多人被它吓住，觉得一定是什么高深东西。');
    await t.say('这名字是 1950 年代一个叫 Richard Bellman 的人起的。当时「规划（programming）」的意思是**排方案、做计划**，跟写程序没关系；「动态」指的是**一步一步分阶段推进**。');
    await t.say('Bellman 自己后来还写过：他挑这个词，一部分原因是它听起来无害，方便申请经费。');

    t.note('所以别被名字骗了', '**「动态规划」= 把一个大问题按「最后一步」拆成同类的小问题，从小到大一格一格算出来，算过的不重算。**\n\n就这些。你已经做完了。');

    t.aside('给写过代码的人：这排格子长什么样', '刚才那一整屏，写成代码就是三行：\n\n`f[0] = 1`\n`f[1] = 1`\n`对 k 从 2 到 n： f[k] = f[k-1] + f[k-2]`\n\n「从上往下问 + 账本」那一版是递归加缓存，「从下往上填表」这一版是循环加数组。两者算出的数字完全一样。\n\n递归版要小心栈深度；填表版每一格都要填。这就是前面说的取舍。');

    await t.say('爬楼梯到此为止。但这门课真正的目的不是让你会数楼梯。');
    await t.say('下一屏换一道**完全不一样**的题——那里的加号会变成别的东西。');
    t.done();
  },
});


// ---- src/levels/09_toll.js ----
FunAl.register({
  id: 'toll',
  title: '换一道题：过路费',
  goal: '让学习者在同一段楼梯上亲手试路，撞上两个直觉陷阱，发现「凭感觉走」和「躲开最贵的」都不可靠。',
  minutes: 3,
  async run(t) {
    const D = FunAl.data.toll;
    const tolls = D.tolls;

    await t.say('还是这段 6 级楼梯，还是一次只能上 1 级或 2 级。');
    await t.say('但这次每级台阶上贴了**过路费**：踩上去就要付那一级的钱。**跳过去的那级不用付。** 地面免费。');
    await t.say('问题也换了：不是「有几种走法」，而是——\n\n**走到第 6 级，最少要花多少钱？**');

    const box = t.canvas();
    const st = FunAl.widgets.stairs(box, {
      n: 6, tolls, hot: [D.pricey], controls: true, showCost: true,
      emptyHint: '走走看。每次走完会记下你花了多少。',
    });

    await t.ask.number('先押一个数：你觉得最少要多少钱？', {
      answer: null, unit: ' 元', button: '押上', placeholder: '你猜几元？',
    });

    await t.say('现在自己去试。走几条不同的路，看看能压到多低。');

    const logBox = t.canvas();
    logBox.innerHTML = '<div class="small muted" style="margin-bottom:8px">你试过的路线</div>';
    const tried = [];
    const chips = FunAl.widgets.routeChips(logBox, [], { format: (x) => x });
    const bestLine = t.el('div', '', '');
    logBox.appendChild(bestLine);
    let best = Infinity, bestRoute = null;
    const claimRow = t.el('div', 'btn-row');
    const claimBtn = t.el('button', 'btn primary', '我找到最省的了');
    claimRow.appendChild(claimBtn);
    logBox.appendChild(claimRow);

    st.onStep((ev) => {
      if (!ev.done) return;
      const key = ev.visited.join('-');
      if (!tried.includes(key)) {
        tried.push(key);
        const isBest = ev.cost < best;
        chips.add(`${ev.visited.join('→')}　${ev.cost} 元`, isBest ? 'gold' : '');
        if (isBest) { best = ev.cost; bestRoute = ev.visited.slice(); }
        bestLine.innerHTML = `<div class="small" style="margin-top:8px">试过 <strong>${tried.length}</strong> 条 · 目前最低 <strong style="color:var(--warn)">${best} 元</strong></div>`;
      }
      setTimeout(() => st.reset(), 800);
    });

    t.hints([
      '一共只有 13 条路，多试几条。',
      '试试「每一步都挑眼前便宜的那级」，看看花多少。',
      '再试试「绕开那个最贵的台阶」，看看是不是更便宜。',
    ]);
    await t.waitFor((resolve) => claimBtn.addEventListener('click', () => {
      if (tried.length < 3) { t.wrong(`你才试了 ${tried.length} 条。多试几条再说——一共有 13 条路。`); return; }
      claimBtn.disabled = true; st.enable(false); resolve(true);
    }));
    t.clearHints();
    t.learnerSays(`我试了 ${tried.length} 条，最低 ${best} 元`);

    if (best === D.bestCost) {
      t.right(`${best} 元——你确实试出了最省的那条。`);
      await t.ask.choice('那再问一句：**你怎么知道没有更省的？**', [
        '不知道。我只是没试到更省的，这不等于没有。',
        '知道，我试的那几条里它最省。',
      ], {
        correct: 0,
        feedback: { 1: `你试了 ${tried.length} 条，一共有 13 条。剩下那些你没看过——万一里面有更便宜的呢？「我找到的里面最省」和「所有路里最省」是两回事。` },
        explainRight: '对。**试出来不等于证明。** 6 级楼梯还能一条条试完，30 级就有一百多万条。这一屏最后会给你一个不用试的办法。',
      });
    } else {
      await t.say(`你的最低是 **${best} 元**。`);
    }

    await t.say('先看两个很多人会用的办法。它们听起来都挺有道理，但都不对。');

    t.note('办法一：每一步都挑眼前便宜的那级', `站在地面：第 1 级 ${tolls[1]} 元，第 2 级 ${tolls[2]} 元 → 去第 1 级。\n\n一路这样挑下去，走出来的是 **${D.greedy.path.join('→')}**，一共 **${D.greedy.cost} 元**。`);

    await t.ask.choice(`这个办法为什么会吃亏？`, [
      `因为「眼前便宜」不代表「往后也便宜」。挑了便宜的那级，可能被它带进更贵的后半段。`,
      `因为它算错了，重新算一遍就对了。`,
    ], {
      correct: 0,
      feedback: { 1: `它没算错，${D.greedy.path.join('→')} 确实是 ${D.greedy.cost} 元。问题是这条路本身就不是最省的。` },
      explainRight: '对。**只看下一步，看不到后面。**',
      hints: ['把它走出来的路线，跟你自己试出来的最好那条比一比。'],
    });

    t.note('办法二：躲开最贵的那级', `全场最贵的是第 ${D.pricey} 级，${tolls[D.pricey]} 元。躲开它最好的走法是 **${D.dodge.path.join('→')}**，一共 **${D.dodge.cost} 元**。\n\n比办法一好，但还是不够省。`);

    await t.say('揭晓。');
    st.clearMarks();
    st.showPath(D.bestPath.slice(1).map((v, i, arr) => v - (i === 0 ? D.bestPath[0] : arr[i - 1])));
    D.bestPath.forEach((i) => st.mark(i, 'gold'));
    await t.pause(700);

    await t.say(`最省的是 **${D.bestPath.join('→')}**，一共 **${D.bestCost} 元**。而且它是 13 条路里**唯一**花 ${D.bestCost} 元的。`);

    await t.ask.choice(`注意看这条最省路线。它踩上了第 ${D.pricey} 级——那个 **${tolls[D.pricey]} 元**的、全场最贵的台阶。这说明什么？`, [
      `说明「躲开贵的」这个直觉也靠不住。有时候非得踩那一脚，因为躲开它要绕更远的路。`,
      `说明这道题设计得不合理。`,
    ], {
      correct: 0,
      feedback: { 1: `价签就是题目给的条件，没有不合理。是**我们的直觉**不可靠：躲开第 ${D.pricey} 级最好也要 ${D.dodge.cost} 元，比踩上去的 ${D.bestCost} 元还贵 ${D.dodge.cost - D.bestCost} 元。` },
      explainRight: `对。躲开它最好 ${D.dodge.cost} 元，踩上去反而只要 ${D.bestCost} 元。**眼睛看着最刺眼的那个数字做决定，一样会错。**`,
      hints: [`比一比：躲开第 ${D.pricey} 级最好 ${D.dodge.cost} 元，最省的那条踩上去只要 ${D.bestCost} 元。`],
    });

    const guess = t.recallOne({ screen: 'toll', kind: 'number' });
    if (guess) await t.say(`（你开场押的是 ${guess.answer} 元。）`);

    await t.say(`两个直觉都被打掉了。6 级楼梯还能一条条试，可要是 30 级——**${FunAl.data.ways.table[30].toLocaleString('en-US')} 条路**，试是试不完的。`);
    await t.say('那就别试了，用你已经会的那套办法：**只看最后一步。**');
    t.done();
  },
});


// ---- src/levels/10_min.js ----
FunAl.register({
  id: 'minrule',
  title: '加号变成挑小的',
  goal: '让学习者自己选出「挑小的再加本级费用」，并弄清计数题为什么不加代价、最优化题为什么要加。',
  minutes: 3,
  async run(t) {
    const D = FunAl.data.toll;
    const tolls = D.tolls;

    await t.say('老办法搬过来：**站在第 6 级，回头看最后一脚。**');

    await t.ask.multi('你的最后一脚，是从哪一级踩上来的？', ['第 3 级', '第 4 级', '第 5 级', '第 6 级'], {
      correct: [1, 2],
      feedback: (got) => {
        if (got.includes(3)) return '第 6 级是你现在站的地方，没法从它踩到它。';
        if (got.includes(0)) return '从第 3 级到第 6 级要跨 3 级，规则没变，一脚最多 2 级。';
        return '一脚只能 1 级或 2 级。从第 6 级往回退 1 级、退 2 级，是哪两级？';
      },
      explainRight: '对。**跟数走法时一模一样：只有两个来源。** 换了问题，这一步没变。',
      hints: ['规则没变，一脚还是只能走 1 级或 2 级。'],
    });

    await t.say('那这两个来源怎么合起来？数走法的时候是**相加**。这次呢？');
    await t.say('这两个数先由我给你（下一屏你自己算）：');

    t.note('已知', `**到第 5 级，最省 ${D.best[5]} 元。**\n\n**到第 4 级，最省 ${D.best[4]} 元。**\n\n第 6 级自己的过路费是 **${tolls[6]} 元**。`);

    await t.ask.choice('那「到第 6 级最省多少」等于什么？', [
      `挑小的(${D.best[5]}, ${D.best[4]}) + ${tolls[6]}`,
      `${D.best[5]} + ${D.best[4]} + ${tolls[6]}`,
      `挑大的(${D.best[5]}, ${D.best[4]}) + ${tolls[6]}`,
      `挑小的(${D.best[5]}, ${D.best[4]})`,
    ], {
      correct: 0,
      feedback: {
        1: `想想这两个数是什么：${D.best[5]} 元是**走第 5 级那条路**的花费，${D.best[4]} 元是**走第 4 级那条路**的花费。\n\n它们是**两条不同的路**各自的价钱。你最后只会走其中一条，只会收到**一张收据**。\n\n把两张收据加起来，等于假设你两条路都走了一遍。`,
        2: '题目问的是**最少**花多少。挑大的那个，等于故意选贵的那条路。',
        3: `方向对了，但漏了一样东西：你**踩上第 6 级**这一脚本身也要付钱，第 6 级贴着 ${tolls[6]} 元。`,
      },
      explainRight: `对：**挑小的(${D.best[5]}, ${D.best[4]}) + ${tolls[6]}**。`,
      hints: [
        '这两个数是两条不同的路各自的花费。你只走一条。',
        '所以是在两个数里**挑一个**，不是把它们加起来。挑哪个？',
        `挑完之后还差一样东西没算：踩上第 6 级要付的那 ${tolls[6]} 元。`,
      ],
    });

    await t.ask.number(`那算一下：到第 6 级最省多少元？`, {
      answer: D.bestCost,
      unit: ' 元',
      feedback: (v) => {
        if (v === D.best[5] + D.best[4] + tolls[6]) return '你把两个数加起来了。它们是两条路各自的花费，你只走一条，只挑一个。';
        if (v === D.best[5]) return `挑对了小的那个（${D.best[5]}），但还没加上踩第 6 级的 ${tolls[6]} 元。`;
        if (v === D.best[4] + tolls[6]) return `你挑的是大的那个（${D.best[4]}）。题目问最少，所以挑小的那个。`;
        return `不对。先在 ${D.best[5]} 和 ${D.best[4]} 里挑小的，再加上第 6 级的 ${tolls[6]} 元。`;
      },
      hints: [`${D.best[5]} 和 ${D.best[4]}，小的是哪个？`, `${D.best[5]} + ${tolls[6]} = ?`],
    });
    t.right(`**${D.best[5]} + ${tolls[6]} = ${D.bestCost} 元。** 和你上一屏试出来的最省数字一样。`);

    await t.say('现在回答一个很多人会卡住的问题。');

    await t.ask.choice('数走法的时候，最后一脚**不用加**任何东西，直接把两堆相加。算钱的时候，却要**加上本级的过路费**。为什么不一样？', [
      '因为数走法时，最后那一脚不会多造出一条路，它只是把两堆路线并在一起；而算钱时，那一脚本身要付钱。',
      '因为计数题和最优化题是两套完全不同的方法。',
    ], {
      correct: 0,
      feedback: {
        1: '两者其实是同一套方法：都是「看最后一步、拆成小题、从小到大算」。不一样的只有**怎么合并**这一步。',
      },
      explainRight: '对。**最后一脚在计数里不产生新路线，在算钱里却要真金白银。** 所以一个不加，一个要加。',
      hints: [
        '问自己：走完最后那一脚，路线的**条数**会变多吗？',
        '再问：走完最后那一脚，你的**钱包**会变少吗？',
      ],
    });

    t.note('同一套办法，只换了一个动作', '先把每一种「最后一步」各自算成一个数——**那一步自己的代价，算进它自己那一支**。然后：\n\n**数「有几种」** → 把这些数**加起来**。\n\n**求「最少」** → 在这些数里**挑小的**。\n\n**求「最多」** → 在这些数里**挑大的**。\n\n这道题里两支的代价碰巧一样（都是踩上第 6 级的 ' + tolls[6] + ' 元），所以写成「挑小的再加 ' + tolls[6] + '」也对。但**别把这当成通则**——有的题里，不同的最后一步代价不同，甚至有一支根本不花钱。到时候就得老老实实一支一支算完再挑。\n\n前面找最后一步、定起步格、从小往大填，全都一模一样。');

    await t.say('下一屏，你自己把这张最省表从头填一遍——而且填完之后，我要你**亲手把那条最省路线倒着找回来**。');
    t.done();
  },
});


// ---- src/levels/11_trust.js ----
FunAl.register({
  id: 'trust',
  title: '凭什么信小格子',
  goal: '让学习者亲手把一条路的前半段换掉，看到后半段一分不变；再用一条新规则让这套办法当场失灵，得到「什么时候能用」的判据。',
  minutes: 4,
  async run(t) {
    const D = FunAl.data.toll;
    const B = FunAl.data.broken;
    const tolls = D.tolls;

    await t.say('这一屏回答一个应该被问的问题：**凭什么相信小格子里那个数？**');
    await t.say(`具体点说：算到第 6 级的时候，我们直接拿了「到第 5 级最省 ${D.best[5]} 元」这个数。万一整条最省的路，它走到第 5 级时**偏偏没走那条最省的前半段**呢？`);

    await t.ask.predict('先押一个：有没有可能出现这种事——一条最省的整路，它的前半段却不是最省的？', [
      '有可能', '不可能',
    ]);

    await t.say(`拿一条真实存在的路来看：**${D.swap.path.join('→')}**，总共 **${D.swap.cost} 元**。`);

    const box = t.canvas();
    const st = FunAl.widgets.stairs(box, { n: 6, tolls, hot: [D.pricey], showCost: true });
    st.showPath([2, 2, 1, 1]);
    D.swap.path.forEach((i) => st.mark(i, 'bad'));

    await t.say(`把它从第 5 级剪成两段：\n\n**前半段** ${D.swap.path.slice(0, 4).join('→')}，花了 **${D.swap.headTo5} 元**。\n\n**后半段** 5→6，花了 **${D.swap.tail} 元**。`);
    await t.say(`可账本说，到第 5 级最省只要 **${D.swap.bestHeadTo5} 元**（走 ${D.bestPath.slice(0, 4).join('→')}）。那就把前半段换掉。`);

    await t.ask.confirm('把前半段换成最省的那段');
    st.clearMarks();
    st.showPath([1, 2, 2, 1]);
    D.bestPath.forEach((i) => st.mark(i, 'gold'));
    await t.pause(700);

    await t.ask.number('换完之后，这条路总共花多少？', {
      answer: D.swap.after,
      unit: ' 元',
      feedback: (v) => {
        if (v === D.swap.cost) return '总价一定会变——你把 ' + D.swap.headTo5 + ' 元的前半段换成了 ' + D.swap.bestHeadTo5 + ' 元的，便宜了 ' + (D.swap.headTo5 - D.swap.bestHeadTo5) + ' 元。';
        if (v === D.swap.bestHeadTo5) return `这是新前半段的钱。别忘了后半段 5→6 那 ${D.swap.tail} 元还得付。`;
        return `新前半段 ${D.swap.bestHeadTo5} 元，后半段 ${D.swap.tail} 元。加起来。`;
      },
      hints: [`前半段现在是 ${D.swap.bestHeadTo5} 元。`, `后半段 5→6 还是 ${D.swap.tail} 元，一分没变。`],
    });

    await t.ask.choice(`关键在这里：换掉前半段之后，后半段 5→6 那 ${D.swap.tail} 元，变了吗？`, [
      `没变。还是 ${D.swap.tail} 元。`,
      `变了，前面的路不一样了，后面当然也不一样。`,
    ], {
      correct: 0,
      feedback: {
        1: `看价签：后半段就是「从第 5 级踩上第 6 级」，要付的是第 6 级的 ${tolls[6]} 元。这笔钱只跟**你现在站在第 5 级**有关，跟你**怎么走到第 5 级的**一点关系都没有。`,
      },
      explainRight: `对。**后半段要花多少，只看你现在站在哪一级，不看你是怎么来的。**`,
      hints: ['后半段要付的是哪一级的过路费？', '那一级的价签，会因为你前面怎么走而变化吗？'],
    });

    t.note('所以小格子可以信', `假如有一条最省的整路，它的前半段**不是**到那一级最省的——\n\n那我就把前半段换成最省的那段。后半段一分不变，总价却降了。\n\n于是「原来那条是最省的」这句话就被推翻了。**所以这种事根本不会发生。**\n\n这就是为什么每一格只需要记**一个数**：到这一级最省多少。`);

    await t.say('好。现在我要把这套办法**弄坏**给你看。');

    t.note('加一条新规则', `**${B.rule}。**\n\n价签一个都没变，走法规则也没变。只多了这一条。`);

    await t.say(`老表算出来的最省是 **${B.oldTableSays} 元**，走 ${D.bestPath.join('→')}。你去把这条路再走一遍，看看现在要付多少。`);

    const box2 = t.canvas();
    const st2 = FunAl.widgets.stairs(box2, {
      n: 6, tolls, hot: [D.pricey], controls: true, showCost: true,
      emptyHint: '走走看。这次连着跨两次 2 级会被罚款。',
      extraCost: (path) => {
        let pen = 0;
        for (let i = 1; i < path.length; i++) if (path[i] === 2 && path[i - 1] === 2) pen += B.penalty;
        return pen;
      },
    });
    let seenTotal = null;
    st2.onStep((ev) => {
      if (!ev.done) return;
      const isTheRoute = ev.visited.join('-') === D.bestPath.join('-');
      if (!isTheRoute) {
        t.wrong(ev.extra
          ? `这条是 ${ev.visited.join('→')}，${ev.cost} 元过路费加 ${ev.extra} 元罚款。不过我要你走的是**老表指的那条**：${D.bestPath.join('→')}，也就是 +1、+2、+2、+1。`
          : `这条是 ${ev.visited.join('→')}，没有连着跨两次 2 级，所以没被罚。去走**老表指的那条**：${D.bestPath.join('→')}，也就是 +1、+2、+2、+1。`);
        setTimeout(() => st2.reset(), 1400);
        return;
      }
      seenTotal = ev.total;
      setTimeout(() => st2.reset(), 1800);
    });
    t.hints([`走 ${D.bestPath.join('→')} 这条：先 +1，再 +2，再 +2，最后 +1。`, '注意中间连着跨了两次 2 级。']);
    await t.waitFor((resolve) => { const iv = setInterval(() => { if (seenTotal !== null) { clearInterval(iv); resolve(seenTotal); } }, 150); });
    t.clearHints();
    st2.enable(false);

    await t.ask.number(`那现在，到第 6 级真正的最省是多少？（13 条路都算上罚款）`, {
      answer: B.realBest,
      unit: ' 元',
      feedback: (v) => {
        if (v === B.oldTableSays) return `${B.oldTableSays} 元是**老表**说的。可你刚才亲手走了那条路，它现在要付 ${B.realBest} 元。老表没把罚款算进去。`;
        if (v < B.realBest) return `没有这么便宜的走法。全部 13 条路加上罚款之后，最便宜的一条是 ${B.realBest} 元。`;
        return `比 ${B.realBest} 贵了。最省的还是 ${D.bestPath.join('→')} 这条：过路费 ${B.realBreakdown.toll} 元 + 罚款 ${B.realBreakdown.penalty} 元。`;
      },
      hints: ['先看你刚走的那条要多少。', `其他路要么过路费更高，要么也躲不掉罚款。最便宜的还是那条：${B.realBreakdown.toll} + ${B.realBreakdown.penalty}。`],
    });

    const cheap = B.allRoutes.filter((r) => r.total < B.realBest);
    t.note('看清楚发生了什么', `老表说 **${B.oldTableSays} 元**。\n\n可 13 条路里，最便宜的一条要 **${B.realBest} 元**。\n\n花 ${B.oldTableSays} 元的走法有 **${cheap.length + (B.allRoutes.filter((r) => r.total === B.oldTableSays).length)} 条**——一条都没有。\n\n**老表不是漏掉了更好的路，它算出了一个买不到的价钱。**`);

    await t.say(`说句公道话：这次最省的**路线**其实没变，还是 ${D.bestPath.join('→')}，只是价钱从 ${B.oldTableSays} 变成了 ${B.realBest}。`);
    await t.say('但这不算老表走运。**罚款金额再高一点，最省的路线就会换成另一条。** 一张算出假价钱的表，你没理由相信它指的路是真的。');

    await t.ask.choice('为什么这次不灵了？', [
      '因为站在第 5 级的时候，「我是怎么来的」开始影响后面要花多少了——上一步是不是跨了 2 级，决定了下一步会不会被罚。',
      '因为罚款让这道题变得太难，没法算。',
    ], {
      correct: 0,
      feedback: {
        1: '难不难先放一边。真正的变化是：**光知道「我在第 5 级」，已经不够决定后面了。** 还得知道你上一步是怎么迈的。',
      },
      explainRight: '对。**上一屏那句话失效了：后半段要花多少，不再只看你站在哪一级。**',
      hints: ['回想刚才那句关键的话：「后半段花多少，只看你现在站在哪一级」。这句话现在还成立吗？', '罚不罚款，取决于你**上一步**是怎么迈的。'],
    });

    t.note('这就是判据（每道新题都该问一遍）', '**站在这一格，只知道格子的编号，够不够决定后面怎么走？**\n\n· 够 → 每格记**一个数**就行。\n· 不够 → 说明格子里少记了东西。把少的那一样补进去。');

    await t.say('那这道被弄坏的题，还能救吗？能。**每一级挂两张纸条**，分开记：');

    const box3 = t.canvas();
    const rowA = FunAl.widgets.cells(box3, {
      n: 6, label: (i) => (i === 0 ? '地面' : `第 ${i} 级`),
      title: '我是走 1 级上来的：最少花多少',
      values: Object.fromEntries(B.byOne.map((v, i) => [i, v]).filter(([, v]) => v != null)),
      placeholder: '×',
    });
    const rowB = FunAl.widgets.cells(box3, {
      n: 6, label: (i) => (i === 0 ? '地面' : `第 ${i} 级`),
      title: '我是跨 2 级上来的：最少花多少',
      values: Object.fromEntries(B.byTwo.map((v, i) => [i, v]).filter(([, v]) => v != null)),
      placeholder: '×',
    });
    rowB.el.style.marginTop = '18px';
    rowA.mark(6, 'gold');

    await t.say(`两排纸条填完，答案就出来了：第 6 级两张纸条是 **${B.byOne[6]}** 和 **${B.byTwo[6]}**，挑小的 → **${B.realBest} 元**。跟穷举的结果一模一样。`);

    t.note('一排不够，就两排', '格子里要记的东西多了一样（我最后一步是怎么迈的），**一排格子就变成了两排**。\n\n办法完全没变，还是「看最后一步、从小往大填」。变的只是**一格里要记几样东西**。\n\n以后你会遇到要记两样东西的题（比如在网格里走，得知道你在第几行第几列）。那时候一排格子就会变成**一整面**。看着吓人，做的还是同一件事。');

    await t.say('回到没有罚款的那道题。下一屏，你自己把最省表填完，然后**亲手把最省路线倒着找回来**。');
    t.done();
  },
});


// ---- src/levels/12_filltable.js ----
FunAl.register({
  id: 'filltable',
  title: '自己填最省表',
  goal: '学习者独立填完整张最省表，然后亲手把最省路线倒着找回来；并处理两个来路一样小的情况。',
  minutes: 4,
  async run(t) {
    const D = FunAl.data.toll;
    const tolls = D.tolls;

    await t.say('罚款那条规则去掉，回到原来那道题。这次整张表由你来填。');

    const box = t.canvas();
    const row = FunAl.widgets.cells(box, {
      n: 6,
      label: (i) => (i === 0 ? '地面' : `第 ${i} 级`),
      sub: (i) => (i === 0 ? '免费' : `过路费 ${tolls[i]}`),
      title: '到这一级，最少花多少钱',
    });

    row.mark(0, 'active');
    await t.ask.number('先定起步格：**地面**那一格填几？', {
      answer: 0,
      unit: ' 元',
      feedback: (v) => {
        if (v === 1) return '1 是**数走法**那道题的答案（一步不走也算一种走法）。这次格子里写的不是走法数，是**花了多少钱**。站在地面，你付过钱吗？';
        if (v === tolls[1]) return `${tolls[1]} 元是踩上**第 1 级**要付的钱。地面那一格问的是「走到地面最少花多少」。`;
        return '你还站在地面，一步没走，一分没付。';
      },
      hints: ['格子里写的是「到这一级最少花多少钱」。', '你现在就在地面上，还没踩过任何一级台阶。'],
    });
    row.set(0, 0, 'given');
    row.clearMarks();
    t.right('**0 元。** 注意这次起步格是 0，上一道题是 1——因为**格子里写的东西变了**。');

    t.note('起步格的通用办法', '不用背。**看格子里写的是什么，再问：最小的那种情况，这个东西是多少？**\n\n· 格子写「有几种走法」→ 地面：什么都不走，算 **1 种**。\n· 格子写「最少花多少钱」→ 地面：**0 元**。\n\n拿不准就用老办法：把规律往下多套一格，看这格必须填几才对得上。');

    await t.say('往上填。每一格的算法你已经知道了：**在左边两格里挑小的，再加上这一级的过路费。**');

    for (let i = 1; i <= 6; i++) {
      const preds = i === 1 ? [0] : [i - 1, i - 2];
      row.links(i, preds, preds.map((p) => `+${i - p}`));
      const a = D.best[i - 1];
      const bb = i >= 2 ? D.best[i - 2] : null;
      t.hints(i === 1
        ? [`到第 1 级只能从地面走 1 级上来。地面是 0 元，第 1 级的过路费是 ${tolls[1]} 元。`]
        : [`看两条弧线指向的格子：第 ${i - 1} 级是 ${a} 元，第 ${i - 2} 级是 ${bb} 元。`,
           `小的那个是 ${Math.min(a, bb)}。再加上第 ${i} 级自己的过路费 ${tolls[i]} 元。`]);
      await row.fill(i, {
        answer: D.best[i],
        onWrong: (v) => {
          if (i === 1) { t.wrong(`到第 1 级只有一条路：从地面走 1 级上来。0 + ${tolls[1]} = ${tolls[1]}。`); return; }
          if (v === a + bb + tolls[i]) t.wrong('你把两个来源加起来了。它们是两条不同的路，你只走一条，只挑一个。');
          else if (v === Math.min(a, bb)) t.wrong(`挑对了小的那个（${Math.min(a, bb)}），但还没加上第 ${i} 级自己的过路费 ${tolls[i]} 元。`);
          else if (v === Math.max(a, bb) + tolls[i]) t.wrong(`你挑的是大的那个（${Math.max(a, bb)}）。题目问最少，挑小的。`);
          else if (v === tolls[i]) t.wrong(`${tolls[i]} 只是这一级的过路费。你还得加上「走到上一站」已经花掉的钱。`);
          else t.wrong(`不对。第 ${i - 1} 级是 ${a} 元，第 ${i - 2} 级是 ${bb} 元，挑小的，再加 ${tolls[i]} 元。`);
        },
        onRight: () => {
          const src = D.from[i];
          row.markLink(src, 'pick');
          if (i >= 2) t.right(`挑小的(${a}, ${bb}) + ${tolls[i]} = **${D.best[i]}**`);
        },
      });
      t.clearHints();
      await t.pause(900);
      row.clearLinks();
    }

    t.right(`表填完了：到第 6 级最省 **${D.bestCost} 元**。跟你自己试出来的一样。`);

    await t.say('但表里只有数字，**没有路线**。');
    await t.say('那条最省的路你早就见过了（上一道题揭晓过）。所以这一步的重点**不是找出它**，而是学会**怎么从一张只有数字的表里，把路线挖出来**——换一道题，你手上就只有这张表了。');
    await t.say('从第 6 格开始，一路往回问：**这一格的数，是从哪一格来的？**');

    const chain = [];
    let cur = 6;
    while (cur > 0) { chain.push(cur); cur = D.from[cur]; }
    for (const k of chain) {
      const src = D.from[k];
      const preds = k === 1 ? [0] : [k - 1, k - 2];
      row.clearLinks();
      row.links(k, preds, preds.map((p) => `+${k - p}`));
      row.mark(k, 'gold');
      if (preds.length === 1) {
        await t.say(`第 ${k} 级只有一个来源：地面。`);
        row.mark(0, 'gold');
        continue;
      }
      const a = D.best[preds[0]], bb = D.best[preds[1]];
      await t.ask.choice(`第 ${k} 格是 ${D.best[k]} 元。它是从哪一格来的？`, [
        `第 ${preds[0]} 级（${a} 元）`,
        `第 ${preds[1]} 级（${bb} 元）`,
      ], {
        correct: preds.indexOf(src),
        feedback: (idx) => {
          const p = preds[idx], val = D.best[p];
          return `如果从第 ${p} 级来，这一格就该是 ${val} + ${tolls[k]} = ${val + tolls[k]} 元。可它写的是 ${D.best[k]} 元。对不上。`;
        },
        explainRight: `对：${D.best[src]} + ${tolls[k]} = ${D.best[k]}。所以最后一脚是从第 ${src} 级上来的。`,
        hints: [`哪一格的数字加上 ${tolls[k]} 元，正好等于 ${D.best[k]}？`],
      });
      row.markLink(src, 'pick');
      row.mark(src, 'gold');
      await t.pause(500);
    }
    row.clearLinks();

    const stBox = t.canvas();
    const st = FunAl.widgets.stairs(stBox, { n: 6, tolls, hot: [D.pricey], showCost: true });
    st.showPath([1, 2, 2, 1]);
    D.bestPath.forEach((i) => st.mark(i, 'gold'));
    t.right(`你倒着走出来的路线是 **${D.bestPath.join('→')}**，${D.bestCost} 元。这就是那条最省的路。`);

    t.note('怎么从表里找回路线', '表里每一格只写了一个数。想知道路线，就**倒着问**：这一格的数，减掉本级的过路费，等于左边哪一格？那一格就是它的来路。\n\n（写代码的时候，也可以填表时顺手记一下「我挑的是哪一格」，省得倒推。）');

    await t.say('还有一个坑，遇到就会卡住。**换一组价签，你自己撞一次。**');

    const T2 = D.tie;
    const box2 = t.canvas();
    const row2 = FunAl.widgets.cells(box2, {
      n: 6,
      label: (i) => (i === 0 ? '地面' : `第 ${i} 级`),
      sub: (i) => (i === 0 ? '免费' : `过路费 ${T2.tolls[i]}`),
      title: '换一组价签，再填一次',
      values: { 0: T2.best[0], 1: T2.best[1], 2: T2.best[2], 3: T2.best[3] },
    });
    await t.say(`前四格我先填好了。你填**第 4、5、6 格**。`);

    for (let i = 4; i <= 6; i++) {
      row2.links(i, [i - 1, i - 2], ['+1', '+2']);
      const a = T2.best[i - 1], bb = T2.best[i - 2];
      t.hints([`第 ${i - 1} 级是 ${a} 元，第 ${i - 2} 级是 ${bb} 元。`, `挑小的，再加第 ${i} 级的 ${T2.tolls[i]} 元。`]);
      await row2.fill(i, {
        answer: T2.best[i],
        onWrong: (v) => {
          if (v === a + bb + T2.tolls[i]) t.wrong('又把两个来源加起来了。它们是两条路，你只走一条。');
          else if (v === Math.min(a, bb)) t.wrong(`挑对了小的（${Math.min(a, bb)}），但还没加第 ${i} 级的 ${T2.tolls[i]} 元。`);
          else t.wrong(`第 ${i - 1} 级 ${a} 元，第 ${i - 2} 级 ${bb} 元，挑小的，再加 ${T2.tolls[i]} 元。`);
        },
      });
      t.clearHints();
      await t.pause(700);
      row2.clearLinks();
    }

    row2.links(6, [5, 4], ['+1', '+2']);
    await t.ask.choice(`现在倒着问：第 6 格的 ${T2.best[6]} 元，是从哪一格来的？`, [
      `第 5 级（${T2.best[5]} 元）`,
      `第 4 级（${T2.best[4]} 元）`,
      `两个都行——它们一样小。`,
    ], {
      correct: 2,
      feedback: {
        0: `第 5 级确实能走通：${T2.best[5]} + ${T2.tolls[6]} = ${T2.best[6]}。但先看一眼第 4 级那格是多少。`,
        1: `第 4 级也确实能走通：${T2.best[4]} + ${T2.tolls[6]} = ${T2.best[6]}。那第 5 级那格呢？`,
      },
      explainRight: `对。第 5 级和第 4 级**都是 ${T2.best[5]} 元**，一样小。`,
      hints: [`把第 5 格和第 4 格的数字念一遍。`, `${T2.best[5]} 和 ${T2.best[4]}，哪个更小？`],
    });
    row2.markLink(5, 'pick'); row2.markLink(4, 'pick');

    await t.ask.choice('那这说明什么？', [
      `说明有**两条**一样省的路线，都花 ${T2.bestCost} 元。挑哪条都对。`,
      '说明这张表填错了。',
      '说明得挑左边那一格，规定就是这样。',
    ], {
      correct: 0,
      feedback: {
        1: '两个数一样大是很正常的事，不是错。你刚才每一格都是照规则算的。',
        2: '没有这种规定。两条路一样便宜，走哪条都花一样的钱。',
      },
      explainRight: `对。**格子里的数不会变，变的只是路线有几条。**`,
      hints: ['两个来源一样小，说明从哪边来，最后都花一样的钱。'],
    });

    const tieBox = t.canvas();
    tieBox.innerHTML = '<div class="small muted" style="margin-bottom:8px">两条路线，都是 ' + T2.bestCost + ' 元</div>';
    T2.paths.forEach((pth) => {
      const holder = t.el('div', '');
      holder.style.marginBottom = '12px';
      tieBox.appendChild(holder);
      const stt = FunAl.widgets.stairs(holder, { n: 6, tolls: T2.tolls, showCost: true, baseH: 30, stepH: 8 });
      const steps = pth.slice(1).map((v, k) => v - pth[k]);
      stt.showPath(steps);
      pth.forEach((i) => stt.mark(i, 'gold'));
    });

    t.note('平局怎么办', `倒着找路线的时候，如果两个来源一样小，**两条都是最省的**，随便走哪条。\n\n（如果题目只要一条，挑哪边都行；如果题目问「有几条最省路线」，那就是另一道题了——你得数，而不是挑。）`);

    await t.say('爬楼梯这个场景到此结束。下一屏是真正的考试：**一道和楼梯毫无关系的题**，你自己上。');
    t.done();
  },
});


// ---- src/levels/13_coins.js ----
FunAl.register({
  id: 'coins',
  title: '一道新题：凑硬币',
  goal: '学习者用四问清单独立解一道和楼梯毫无关系的题，并处理「凑不出来」的格子。',
  minutes: 5,
  async run(t) {
    const C = FunAl.data.coins;
    const U = C.unreachable;

    await t.say('楼梯没了。这道题跟台阶、跟走路，一点关系都没有。');
    t.note('题目', `你有 **${C.values.join(' 元、')} 元**三种硬币，每种要多少有多少。\n\n要**正好**凑出 **${C.target} 元**。\n\n**最少用几枚？**`);

    await t.ask.number('先押一个数。', { answer: null, unit: ' 枚', button: '押上', placeholder: '你猜几枚？' });

    await t.say('先随手凑凑看，找找感觉。');

    const trayBox = t.canvas();
    trayBox.innerHTML = '<div class="small muted" style="margin-bottom:10px">点硬币放进钱袋</div>';
    const btnRow = t.el('div', 'btn-row');
    C.values.forEach((v) => {
      const b = t.el('button', 'btn', `${v} 元`);
      b.addEventListener('click', () => add(v));
      btnRow.appendChild(b);
    });
    const clear = t.el('button', 'btn', '倒出来重凑');
    btnRow.appendChild(clear);
    trayBox.appendChild(btnRow);
    const purse = t.el('div', '', '');
    trayBox.appendChild(purse);
    const recBox = t.el('div', 'small muted', '');
    trayBox.appendChild(recBox);

    let coins = [], bestN = Infinity, bestSet = null;
    const found = [];
    function render() {
      const sum = coins.reduce((a, b) => a + b, 0);
      purse.innerHTML = `<div style="margin:10px 0;font-size:1.05rem">钱袋：${coins.length ? coins.map((c) => `<span class="w-chip" style="display:inline-block;margin:2px">${c} 元</span>`).join('') : '<span class="muted">空的</span>'}
        <div style="margin-top:6px">一共 <strong style="color:${sum === C.target ? 'var(--ok)' : 'var(--ink)'}">${sum}</strong> 元 · <strong>${coins.length}</strong> 枚</div></div>`;
      recBox.innerHTML = found.length
        ? `凑成 ${C.target} 元的组合你找到了 ${found.length} 种，最少的一种用了 <strong>${bestN}</strong> 枚（${bestSet.join('+')}）`
        : '';
    }
    function add(v) {
      const sum = coins.reduce((a, b) => a + b, 0);
      if (sum + v > C.target) { t.wrong(`放进去就超过 ${C.target} 元了（${sum} + ${v} = ${sum + v}）。题目要求**正好**凑够，不能多。`); return; }
      coins.push(v);
      const ns = coins.reduce((a, b) => a + b, 0);
      render();
      if (ns === C.target) {
        const key = coins.slice().sort().join('+');
        if (!found.includes(key)) {
          found.push(key);
          if (coins.length < bestN) { bestN = coins.length; bestSet = coins.slice().sort((a, b) => b - a); }
        }
        render();
        setTimeout(() => { coins = []; render(); }, 1400);
      }
    }
    clear.addEventListener('click', () => { coins = []; render(); });
    render();

    const goRow = t.el('div', 'btn-row');
    const goBtn = t.el('button', 'btn primary', '凑够了，往下走');
    goRow.appendChild(goBtn);
    trayBox.appendChild(goRow);
    t.hints(['先试试老实办法：先拿最大的 4 元，剩下 2 元怎么办？', '再试试完全不用 4 元的凑法。']);
    await t.waitFor((resolve) => goBtn.addEventListener('click', () => {
      if (!found.length) { t.wrong(`先至少凑成一次 ${C.target} 元再往下走。`); return; }
      goBtn.disabled = true; resolve(true);
    }));
    t.clearHints();
    t.learnerSays(`我找到 ${found.length} 种凑法，最少 ${bestN} 枚`);

    t.note('先看一个很自然、但会吃亏的办法', `**先拿最大面值的**：${C.greedyBig.coins.join(' + ')} = ${C.target} 元，用了 **${C.greedyBig.count} 枚**。\n\n可正确答案是 **${C.best} 枚**（${C.bestCoins.join(' + ')}）。**先拿大的又输了一次。**`);

    await t.say('好，正经做。**四个问题，你自己来答。** 你在楼梯上已经答过一遍了。');

    await t.ask.choice('**第一问：一格代表什么？**', [
      `每个**金额**一格：0 元、1 元、2 元……${C.target} 元。格子里写「凑这个金额最少要几枚」。`,
      `每种**硬币**一格：1 元一格、3 元一格、4 元一格。格子里写「这种硬币用几枚」。`,
      `每**枚**硬币一格：第 1 枚、第 2 枚……格子里写「这一枚是几元」。`,
    ], {
      correct: 0,
      feedback: {
        1: '只有三格的话，你没法「从小往大填」——3 元那格和 4 元那格谁在前谁在后？而且它也不是一道「更小的同类题」。\n\n格子的编号要能**从小排到大**，而且每一格都得是**同一道题的更小版本**。',
        2: '「第 1 枚是几元」不是一道能独立回答的题——它取决于后面几枚怎么配。而且你事先根本不知道要几枚。',
      },
      explainRight: `对。**每个金额一格**，格子里写「凑这个金额最少几枚」。\n\n这跟楼梯题一模一样：楼梯是「走到第 k 级」，这里是「凑到 k 元」。`,
      hints: [
        '想想楼梯题里，格子的编号是什么？（第几级）那这道题里，什么东西可以从小排到大？',
        '把题目念一遍：「凑出 6 元最少几枚」。把 6 换成一个更小的数，还是同一道题吗？',
      ],
    });

    await t.ask.multi(`**第二问：最后放进钱袋的那一枚，可能是几元？**（可多选）`, ['1 元', '3 元', '4 元', '6 元'], {
      correct: [0, 1, 2],
      feedback: (got) => {
        if (got.includes(3)) return '你没有 6 元的硬币。只有 1、3、4 元三种。';
        return `三种硬币都可能是最后放的那一枚。你少选了 ${3 - got.filter((g) => g < 3).length} 个。`;
      },
      explainRight: '对，三种都有可能。**楼梯题的最后一脚有 2 种，这道题的最后一枚有 3 种。** 这就是唯一的区别。',
      hints: ['你手上有几种硬币？每一种都有可能是最后放进去的那一枚吗？'],
    });

    await t.ask.choice(`那最后一枚如果是 3 元，剩下的是一道什么题？`, [
      `凑 ${C.target - 3} 元最少几枚——同一道题，数字更小。`,
      `凑 3 元最少几枚。`,
      `一道全新的题，跟原来没关系。`,
    ], {
      correct: 0,
      feedback: {
        1: '3 元是你**放进去**的那一枚，不是剩下要凑的。总共 6 元，放了 3 元，还差多少？',
        2: `「凑 ${C.target - 3} 元最少几枚」和「凑 ${C.target} 元最少几枚」是同一句话，只是数字变小了。这正是我们要的。`,
      },
      explainRight: `对。**剪掉最后一枚，剩下的还是同一道题，只是金额更小。** 判据满足，这套办法能用。`,
      hints: [`总共要凑 ${C.target} 元，最后一枚放了 3 元，前面已经凑了多少？`],
    });

    await t.ask.choice('**第三问：三个来源怎么合起来？**', [
      '在三个来源里**挑最小的**，再 **+1 枚**（最后那一枚自己也算一枚）。',
      '把三个来源**加起来**，再 +1 枚。',
      '在三个来源里挑最小的就行，不用 +1。',
    ], {
      correct: 0,
      feedback: {
        1: '三个来源是**三种不同的凑法**各自要几枚。你只会用其中一种，不会三种一起用。',
        2: `最后那一枚硬币，它自己也要占一枚。就像楼梯题里踩上那一级要付过路费一样——**最后一步自己的代价不能漏。**`,
      },
      explainRight: '对：**挑小的(三个来源) + 1 枚。**',
      hints: ['问自己：这三个数是三条不同的路，还是同一条路的三段？', '最后那一枚硬币，算不算一枚？'],
    });

    await t.ask.number('**第四问：起步格。凑 0 元，最少要几枚？**', {
      answer: 0,
      unit: ' 枚',
      feedback: (v) => v === 1
        ? '一枚都不用放，就已经凑够 0 元了。（楼梯题里地面是 1，因为那里数的是「走法」，「一步不走」也算一种。这里数的是「枚数」，一枚不放就是 0 枚。）'
        : `格子里写的是「要用几枚硬币」。要凑 0 元，你需要放几枚进去？`,
      hints: ['把题目念一遍：凑 0 元最少要几枚硬币？', '一枚都不放，钱袋里就是 0 元。'],
    });
    t.right('**0 枚。** 起步格又变了——因为格子里写的东西又变了。办法没变。');

    await t.say('四问答完，表自己就长出来了。填吧。');

    const box = t.canvas();
    const row = FunAl.widgets.cells(box, {
      n: C.target,
      label: (i) => `凑 ${i} 元`,
      values: { 0: 0 },
      title: '凑这个金额，最少几枚',
    });

    for (let a = 1; a <= C.target; a++) {
      const preds = C.values.map((v) => a - v);
      const valid = preds.filter((x) => x >= 0);
      row.links(a, valid, valid.map((x) => `−${a - x}`));
      const outOfRange = preds.filter((x) => x < 0);
      if (outOfRange.length) row.setSub(a, `${outOfRange.length} 条来路越界`);
      const opts = valid.map((x) => C.table[x]);
      t.hints([
        valid.length < C.values.length
          ? `注意：凑 ${a} 元时，有 ${C.values.length - valid.length} 种硬币比 ${a} 元还大，放不进去。只看剩下的 ${valid.length} 条来路。`
          : `三条来路：凑 ${valid.join(' 元、')} 元这几格。`,
        `它们分别是 ${opts.join('、')} 枚。挑最小的，再 +1。`,
      ]);
      await row.fill(a, {
        answer: C.table[a],
        onWrong: (v) => {
          const mn = Math.min(...opts);
          if (v === mn) t.wrong(`挑对了最小的（${mn} 枚），但漏了最后那一枚硬币自己。别忘了 +1。`);
          else if (v === opts.reduce((x, y) => x + y, 0) + 1) t.wrong('你把几个来源加起来了。它们是几种不同的凑法，你只用一种。');
          else if (v === Math.max(...opts) + 1) t.wrong(`你挑的是最大的那个。题目问**最少**几枚。`);
          else if (valid.length < C.values.length && v === C.table[a - C.values[C.values.length - 1]] + 1) t.wrong(`那一格越界了：凑 ${a} 元的时候，放不下一枚 ${C.values[C.values.length - 1]} 元的硬币。`);
          else t.wrong(`不对。来路是 ${valid.map((x) => `凑 ${x} 元（${C.table[x]} 枚）`).join('、')}。挑最小的，再 +1。`);
        },
        onRight: () => { row.markLink(C.from[a], 'pick'); },
      });
      t.clearHints();
      await t.pause(700);
      row.clearLinks();
    }

    const bet = t.recallOne({ screen: 'coins', kind: 'number' });
    t.right(`**凑 ${C.target} 元，最少 ${C.best} 枚。**${bet ? `（你开场押的是 ${bet.answer} 枚。）` : ''}`);
    await t.say(`倒着找回来：第 ${C.target} 格是从「凑 ${C.from[C.target]} 元」那格来的，所以最后一枚是 ${C.target - C.from[C.target]} 元。再往回，凑 ${C.from[C.target]} 元又是从「凑 0 元」来的，那一枚也是 ${C.from[C.target]} 元。\n\n所以是 **${C.bestCoins.join(' + ')}**。`);

    t.note('你刚才做了什么', `一道跟楼梯毫无关系的题，你用**同一套四问**做完了：\n\n**一格代表什么** → 每个金额一格\n**最后一步有哪几种** → 最后一枚是 1、3 还是 4 元\n**怎么合并** → 挑小的，再 +1\n**起步格填几** → 凑 0 元 = 0 枚`);

    await t.say('还有一个坑，遇到就会卡住，先给你踩一次。');
    t.note('如果凑不出来呢', `换一套硬币：**只有 ${U.values.join(' 元和 ')} 元**，没有 1 元了。\n\n那「凑 ${U.target} 元」怎么办？${U.target} − ${U.values[0]} = ${U.target - U.values[0]} 元凑不出，${U.target} − ${U.values[1]} = ${U.target - U.values[1]} 元也凑不出。**${U.values.length} 条来路全军覆没。**`);

    await t.ask.choice(`那「凑 ${U.target} 元」那一格该填什么？`, [
      '填一个大到永远不会被挑中的数，表示「这一格根本凑不出来」。',
      '填 0。反正凑不出来，就当没有。',
      `填 ${U.target}。凑不出来就按最坏情况算。`,
    ], {
      correct: 0,
      feedback: {
        1: `填 0 会出事。往后算「凑 8 元」的时候，它会看到「凑 ${U.target} 元只要 0 枚」，于是以为 8 = ${U.target} + 3 只用 **1 枚**就够了。可 ${U.target} 元根本凑不出来，这条路是假的。**0 是个会骗人的数。**`,
        2: `${U.target} 也是个具体的数字，后面的格子照样会拿它去比大小，还是会算出假答案。你要的是一个**永远比不过任何真实答案**的东西。`,
      },
      explainRight: `对。写代码时通常填一个很大的数（比如 999999，或者「无穷大」）。它大到**永远不会在「挑小的」时候胜出**，于是不会污染后面的格子。\n\n最后如果目标那一格还是那个大数，就说明**真的凑不出来**。`,
      hints: [
        `试试填 0，然后自己算一下「凑 8 元」会得出什么。（真实答案是 2 枚：4 + 4。）`,
        '你要的是一个数，它大到在「挑小的」时候永远输。',
      ],
    });

    t.note(`这套硬币的完整表`, `**${U.values.join(' 元和 ')} 元**：\n\n${U.table.map((v, i) => `凑 ${i} 元 = ${v === null ? '**凑不出**' : v + ' 枚'}`).join('　·　')}\n\n注意 **凑 ${U.target} 元凑不出**，可 **凑 6 元只要 2 枚**（3 + 3）。凑不出的格子不会拖累它后面的格子。`);

    await t.say('最后一屏：把你带得走的东西收一收。');
    t.done();
  },
});


// ---- src/levels/14_takeaway.js ----
FunAl.register({
  id: 'takeaway',
  title: '带走一张清单',
  goal: '让学习者回看自己走过的路，把四问排成清单，并在三道没见过的题上只做「认题」练习。',
  minutes: 4,
  async run(t) {
    const W = FunAl.data.ways, D = FunAl.data.toll, C = FunAl.data.coins;

    await t.say('结束之前，先回头看看你自己做过什么。');

    const log = t.recall();
    const answered = log.filter((e) => e.correct !== undefined).length;
    const gotWrong = log.filter((e) => e.correct === false).length;
    const bet1 = t.recallOne({ screen: 'hook', kind: 'number' });
    const betToll = t.recallOne({ screen: 'toll', kind: 'number' });
    const betCoin = t.recallOne({ screen: 'coins', kind: 'number' });

    const lines = [];
    if (bet1) lines.push(`开场你押「到第 6 级有 ${bet1.answer} 种走法」，最后你自己算出了 **${W.table[6]} 种**。`);
    if (betToll) lines.push(`过路费那题你押 ${betToll.answer} 元，自己填表填出了 **${D.bestCost} 元**。`);
    if (betCoin) lines.push(`硬币那题你押 ${betCoin.answer} 枚，自己填表填出了 **${C.best} 枚**。`);
    lines.push(`一路上你回答了 **${answered}** 个有对错的问题${gotWrong ? `，其中 **${gotWrong}** 次先答错了再改对` : ''}。`);
    t.note('你走过的路', lines.join('\n\n') + (gotWrong ? '\n\n答错的那几次才是真正学到东西的地方。' : ''));

    await t.say('你做完了三道题：**数走法**、**算最省的钱**、**凑最少的硬币**。三道题长得完全不一样，但你每次做的事是同一件。');
    await t.say('把那件事排成顺序。**下面四句话，哪一句得先问？**');

    await t.ask.order('按你实际做事的顺序，把这四句排好：', [
      '**一格代表什么？** 找一个能从小排到大的编号，格子里写题目问的那个东西。',
      '**最后一步有哪几种可能？** 每一种，都对应一个更小的格子。',
      '**几个来源怎么合起来？** 数「有几种」就相加；求「最少」就挑小的，求「最多」就挑大的，再加上这一步自己的代价。',
      '**起步格填几？** 看格子里写的是什么，最小的那种情况它是多少。',
    ], {
      shuffled: [2, 0, 3, 1],
      feedback: (idx, next) => {
        const names = ['「一格代表什么」', '「最后一步有哪几种」', '「怎么合起来」', '「起步格填几」'];
        if (next === 0) return `还不到这一句。你得**先知道格子是什么**，才谈得上后面几步。`;
        if (idx === 0) return '这一句你已经放过了。';
        return `${names[idx]} 还早。在问它之前，你得先答完前面那几句——你回想一下在硬币那道题上，你是按什么顺序答的。`;
      },
      explainRight: '这就是你在硬币那道题上的实际顺序。',
      hints: [
        '想想硬币那一屏，我一共问了你四个问题，第一个问的是什么？',
        '顺序是：格子是什么 → 最后一步有哪几种 → 怎么合 → 起步格。',
      ],
    });

    t.note('把这张清单带走', '**一、一格代表什么？**（能从小排到大，格子里写题目问的东西）\n\n**二、最后一步有哪几种可能？**（每一种对应一个更小的格子）\n\n**三、几个来源怎么合起来？**（几种 → 相加；最少 → 挑小的；最多 → 挑大的；别忘了加上这一步自己的代价）\n\n**四、起步格填几？**（看格子里写的是什么，最小情况下它是多少）\n\n然后从小到大，一格一格填过去。');

    await t.say('最后练三道。**只问第一句：一格代表什么。不用算。**');

    await t.ask.choice('**（一）** 一只青蛙，一次能跳 1 格或者 3 格。跳到第 10 格，有几种跳法？', [
      '每一格一格，格子里写「跳到这一格有几种跳法」；来路是前 1 格和前 3 格。',
      '每一种跳法一格。',
      '两格：一格写「跳 1 格的次数」，一格写「跳 3 格的次数」。',
    ], {
      correct: 0,
      feedback: {
        1: '跳法有多少种正是要求的答案，你事先不知道有几种，没法给它们编号。',
        2: '这两个数字不能从小排到大，也没法用「更小的同类题」往下拆。',
      },
      explainRight: '对。**跟爬楼梯是同一道题**，只是最后一脚从「1 级或 2 级」变成了「1 格或 3 格」。',
      hints: ['这道题跟你做的第一道题，差别只有一处。哪一处？'],
    });

    await t.ask.choice('**（二）** 一排房子，每家有些钱。不能偷相邻的两家。最多能偷多少？', [
      '每个位置一格，格子里写「只看前面这几家，最多能偷多少」；最后一步是「偷不偷这一家」。',
      '每个位置一格，格子里写「这一家偷不偷」。',
      '每个位置一格，格子里写「这一家有多少钱」。',
    ], {
      correct: 0,
      feedback: {
        1: '「偷不偷」是**选择**，不是答案。格子里要写的是题目问的那个东西——最多能偷多少**钱**。',
        2: '这是题目给的条件，不是你要算的东西。格子里写的应该是**答案**。',
      },
      explainRight: '对。注意这道题的「最后一步」不是「从哪儿来」，而是「**偷还是不偷**」。\n\n偷 → 这家的钱 + 前 k−2 家的答案（隔壁不能偷）。\n不偷 → 前 k−1 家的答案。\n\n**求「最多」，所以挑大的。** 四问一个没少。',
      hints: [
        '题目问的是「最多能偷多少钱」。那格子里该写什么？',
        '这道题的「最后一步」不是从哪一级走上来，而是一个**选择**：这一家，偷还是不偷。',
      ],
    });

    await t.ask.choice('**（三）** 一个机器人在方格纸上，只能向右或者向下走。从左上角到右下角，有几条路？', [
      '每个格子一格，写「到这个格子有几条路」；来路是左边一格和上面一格。格子排成一**面**，不是一排。',
      '每一行一格，写「这一行有几条路」。',
      '这道题用不了这套办法。',
    ], {
      correct: 0,
      feedback: {
        1: '一行里的每个格子答案都不一样，一行只写一个数是不够的。**位置要用两个数才说得清：第几行、第几列。**',
        2: '能用。只是「我在哪儿」这次要用两个数字来说（第几行第几列），所以格子铺成一面而不是排成一排。',
      },
      explainRight: '对。**这就是那句判据在起作用**：站在这里，光知道「第几行」不够，还得知道「第几列」。所以格子里要记的东西多了一样，一排就变成了一面。\n\n跟你在罚款那一屏见过的一模一样。办法没变。',
      hints: [
        '在方格纸上，你要说清「我现在在哪儿」，需要几个数字？',
        '回想罚款那一屏：光知道「我在第几级」不够的时候，一排格子变成了几排？',
      ],
    });

    await t.ask.choice('**（四）** 最后一道，回到开场那句话。**手机地图给你算最快路线**——一格代表什么？', [
      '每个**路口**一格，写「从出发地到这个路口最快要几分钟」；来路是通到它的那几条路，**挑小的**再加上那段路要花的时间。',
      '每条**路**一格，写「这条路要开几分钟」。',
      '每个**目的地**一格，写「到这个目的地最快几分钟」。',
    ], {
      correct: 0,
      feedback: {
        1: '「这条路要开几分钟」是地图**已经知道的条件**，不是要算的答案。格子里写的应该是你还不知道、需要算出来的那个东西。',
        2: '你只有一个目的地，那就只有一格，没法从小往大填。中间那些路口才是你需要一格一格填过去的东西。',
      },
      explainRight: '对。**这就是你刚才填的最省表**，只不过格子不再排成一排，而是散在地图上。\n\n「挑小的再加这一段的时间」——一模一样。',
      hints: [
        '地图上什么东西是**很多个**、而且可以一个一个算过去的？',
        '想想过路费楼梯：格子是「台阶」，格子里写「到这一级最少花多少」。地图上跟「台阶」对应的是什么？',
      ],
    });

    await t.say('四道题，你都没算，但你都知道该从哪儿下手了。**这就是这门课想给你的东西。**');

    t.note('开场那三个例子，现在都拆得开了', '**地图算最快路线** → 你刚刚自己答出来了。\n\n**拼写检查把「recieve」改成「receive」** → 格子里写「把这半截改成那半截，最少改几个字母」；最后一步有三种：删一个、加一个、换一个；**挑小的**再 +1。（这题的格子要用两个数才说得清「改到哪儿了」，所以铺成一面。）\n\n**输入法猜你下一个字** → 同一套路：每多打一个字就往前推一格，算过的不重算。\n\n**跟你刚才填的那几张表，是同一件事。**');

    await t.say('课程到这里就结束了。');
    await t.say('如果你还有想不通的地方，页面底部有「问导师」（开着的话）。它不会直接给你答案——跟这门课一样，它只会往你想通的方向推一把。');

    t.aside('给写过代码的人：三道题的三行代码', '**爬楼梯**\n`f[0]=1; f[1]=1`\n`for k in 2..n: f[k] = f[k-1] + f[k-2]`\n\n**过路费楼梯**\n`g[0]=0; g[1]=toll[1]`\n`for k in 2..n: g[k] = toll[k] + min(g[k-1], g[k-2])`\n\n**凑硬币**\n`h[0]=0; 其余先填一个很大的数`\n`for a in 1..target: h[a] = min(h[a-c] for c in coins if c<=a) + 1`\n\n三段循环长得几乎一样。变的只有三处：格子的编号、来路、以及合并用的是 `+` 还是 `min`。');

    t.done({ label: '回到目录' });
  },
});
