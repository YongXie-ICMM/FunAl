<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动态规划，从一段楼梯开始</title>
<meta name="description" content="一个循循善诱的互动教程：不背公式，亲手发现动态规划为什么存在、怎么用。">
<style>
/* FunAl - DP tutorial base styles. Warm, calm, one column, big type. */
:root {
  --bg: #faf7f1;
  --paper: #ffffff;
  --ink: #1f2328;
  --muted: #6b6f76;
  --line: #e6e1d6;
  --accent: #2456c9;
  --accent-soft: #e8effc;
  --learner: #e8f1fb;
  --ok: #15803d;
  --ok-soft: #e6f4ea;
  --warn: #9a5b00;
  --warn-soft: #fff4e0;
  --hint-soft: #fbf3d9;
  --shadow: 0 6px 24px rgba(30, 30, 40, .07);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171b; --paper: #1e2126; --ink: #e9e9ec; --muted: #9aa0a8; --line: #2c3037;
    --accent: #7aa2ff; --accent-soft: #1c2a4a; --learner: #1c2a4a;
    --ok: #5fc27a; --ok-soft: #173322; --warn: #f0b35a; --warn-soft: #3a2a10; --hint-soft: #3a3313;
    --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 18px; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  line-height: 1.75; -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: default; }
code { font-family: var(--mono); font-size: .92em; background: var(--accent-soft); padding: .05em .4em; border-radius: 6px; }
strong { font-weight: 700; }

/* ---------- layout ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.topbar-title { flex: 1; font-weight: 600; font-size: .95rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-progress { display: flex; gap: 5px; align-items: center; }
.topbar-progress .dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--line); background: transparent; }
.topbar-progress .dot.done { background: var(--ok); border-color: var(--ok); }
.topbar-progress .dot.now { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.topbar-btn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: .9rem; color: var(--ink); }

.toc {
  position: fixed; top: 52px; left: 12px; z-index: 30; width: min(360px, calc(100vw - 24px));
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 8px; max-height: 70vh; overflow: auto;
}
.toc button {
  display: flex; width: 100%; text-align: left; gap: 10px; align-items: baseline;
  border: 0; background: transparent; color: var(--ink); padding: 8px 10px; border-radius: 10px; font-size: .95rem;
}
.toc button:hover { background: var(--accent-soft); }
.toc button .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.toc button.done .n::after { content: " ✓"; color: var(--ok); }
.toc button.now { background: var(--accent-soft); font-weight: 600; }
.toc .toc-actions { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
.toc .toc-actions button { color: var(--muted); font-size: .85rem; }

.feed {
  flex: 1; width: min(760px, 100%); margin: 0 auto; padding: 22px 16px 140px;
  display: flex; flex-direction: column; gap: 14px;
}
.dock {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: center; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  pointer-events: none;
}
.dock-btn { pointer-events: auto; border-radius: 999px; padding: 12px 22px; font-size: 1rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
.dock-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.dock-btn.ghost { color: var(--accent); }
.dock-btn:disabled { opacity: .5; box-shadow: none; }

/* ---------- feed blocks ---------- */
.reveal { animation: rise .38s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.bubble { max-width: 100%; padding: 14px 18px; border-radius: var(--radius); }
.bubble.tutor { background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); align-self: flex-start; }
.bubble.learner { background: var(--learner); align-self: flex-end; max-width: 80%; border-bottom-right-radius: 4px; }
.bubble.right { border-left: 5px solid var(--ok); background: var(--ok-soft); }
.bubble.wrong { border-left: 5px solid var(--warn); background: var(--warn-soft); }
.bubble.hint { border: 1px dashed var(--warn); background: var(--hint-soft); }
.bubble.hint .hint-tag { display: inline-block; font-size: .8rem; color: var(--warn); font-weight: 700; margin-right: 8px; }
.bubble.error { border-left: 5px solid #c0392b; }
.bubble p { margin: 0; }
.bubble p + p { margin-top: .6em; }

.note { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 18px; border-left: 5px solid var(--accent); }
.note .note-title { font-weight: 700; margin-bottom: 4px; }

.canvas {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); overflow-x: auto;
}
.block { }

.choices { display: flex; flex-direction: column; gap: 10px; align-self: stretch; }
.choices button {
  text-align: left; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: 1rem; line-height: 1.5;
  transition: border-color .15s, background .15s;
}
.choices button p { margin: 0; }
.choices button p + p { margin-top: .4em; }
.choices button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.choices button.wrong { border-color: var(--warn); background: var(--warn-soft); color: var(--muted); text-decoration: line-through; }
.choices button.right { border-color: var(--ok); background: var(--ok-soft); font-weight: 600; }
.choices button.picked { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.choices button:disabled:not(.wrong):not(.right):not(.picked) { opacity: .55; }

.numask { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.numask input {
  font: inherit; font-size: 1.15rem; width: 8em; padding: 10px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  -moz-appearance: textfield; appearance: textfield;
}
.numask input::-webkit-outer-spin-button,
.numask input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.numask input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.numask .unit { color: var(--muted); }
.btn { border-radius: 999px; padding: 10px 20px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: 1rem; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn:disabled { opacity: .5; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

.muted { color: var(--muted); }
.small { font-size: .9rem; }
.center { text-align: center; }
.title-card { padding: 6px 0 2px; }
.title-card h1 { margin: 0 0 6px; font-size: 1.55rem; line-height: 1.3; }
.title-card .sub { color: var(--muted); margin: 0; }

/* ---------- mentor sheet ---------- */
.mentor {
  position: fixed; right: 16px; bottom: 84px; z-index: 40; width: min(420px, calc(100vw - 32px)); height: min(560px, calc(100vh - 120px));
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 40px rgba(0,0,0,.18);
  display: flex; flex-direction: column;
}
.mentor-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mentor-sub { color: var(--muted); font-size: .8rem; flex-basis: 100%; }
.mentor-close { margin-left: auto; border: 0; background: transparent; font-size: 1.4rem; line-height: 1; color: var(--muted); }
.mentor-log { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.mentor-log .m { padding: 10px 12px; border-radius: 12px; font-size: .95rem; }
.mentor-log .m.me { background: var(--learner); align-self: flex-end; max-width: 85%; }
.mentor-log .m.ai { background: var(--bg); border: 1px solid var(--line); align-self: flex-start; max-width: 95%; }
.mentor-log .m.sys { color: var(--muted); font-size: .85rem; align-self: center; text-align: center; }
.mentor-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.mentor-form input { flex: 1; font: inherit; font-size: .95rem; padding: 10px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.mentor-form input:focus { outline: 2px solid var(--accent); }

@media (max-width: 600px) {
  html { font-size: 17px; }
  .bubble.learner { max-width: 92%; }
  .mentor { right: 8px; left: 8px; width: auto; bottom: 76px; height: min(70vh, 520px); }
  .dock-btn { padding: 11px 16px; font-size: .95rem; }
}
@media print { .dock, .topbar, .mentor { display: none !important; } }

/* ---------- multi / order / match ---------- */
.choices button.multi { padding-left: 44px; position: relative; }
.choices button.multi::before {
  content: ""; position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 6px; background: var(--paper);
}
.choices button.multi.picked::before { border-color: var(--accent); background: var(--accent); }
.choices button.multi.picked::after {
  content: ""; position: absolute; left: 20px; top: 50%; width: 5px; height: 10px;
  border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-65%) rotate(45deg);
}

.order { display: flex; flex-direction: column; gap: 12px; }
.order-slots { display: flex; flex-direction: column; gap: 8px; }
.order-slot { display: flex; gap: 10px; align-items: baseline; background: var(--ok-soft); border: 1.5px solid var(--ok); border-radius: 12px; padding: 10px 14px; animation: rise .3s ease-out; }
.order-slot .n { font-weight: 700; color: var(--ok); }
.order-slot p { margin: 0; }
.order-pool { display: flex; flex-direction: column; gap: 8px; }
.order-card { text-align: left; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: 1rem; }
.order-card:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.order-card p { margin: 0; }

.match { display: flex; gap: 12px; align-items: flex-start; }
.match-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.match-card { text-align: left; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: .95rem; line-height: 1.5; }
.match-card p { margin: 0; }
.match-card.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
.match-card.armed { border-style: dashed; border-color: var(--accent); }
.match-card.right { border-color: var(--ok); background: var(--ok-soft); }
.match-card:disabled { cursor: default; }
.shake { animation: shake .3s; }
@media (max-width: 560px) { .match { flex-direction: column; } }

.aside { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); padding: 0 14px; }
.aside > summary { cursor: pointer; padding: 11px 0; font-weight: 600; font-size: .95rem; color: var(--accent); list-style: none; }
.aside > summary::-webkit-details-marker { display: none; }
.aside > summary::before { content: "+ "; font-weight: 700; }
.aside[open] > summary::before { content: "\2212 "; }
.aside[open] > summary { border-bottom: 1px solid var(--line); }
.aside-body { padding: 10px 0 14px; font-size: .95rem; }
.aside-body p { margin: 0; }
.aside-body p + p { margin-top: .6em; }

.way-out .btn { border-style: dashed; color: var(--muted); }
.way-out .btn:hover { color: var(--ink); border-color: var(--accent); }

</style>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button class="topbar-btn" id="tocBtn" aria-haspopup="true" aria-expanded="false" title="目录">目录</button>
    <div class="topbar-title" id="topbarTitle"></div>
    <div class="topbar-progress" id="topbarProgress" aria-label="进度"></div>
  </header>
  <nav class="toc" id="toc" hidden></nav>
  <main class="feed" id="feed" aria-live="polite"></main>
  <footer class="dock" id="dock">
    <button class="dock-btn ghost" id="hintBtn" hidden>需要提示</button>
    <button class="dock-btn ghost" id="mentorBtn" hidden>问导师</button>
    <button class="dock-btn primary" id="nextBtn" hidden>下一步</button>
  </footer>
</div>

<aside class="mentor" id="mentor" hidden aria-label="AI 导师">
  <div class="mentor-head">
    <strong>导师</strong>
    <span class="mentor-sub" id="mentorSub">它知道你现在在哪一屏、刚才答了什么。它不会直接给答案。</span>
    <button class="mentor-close" id="mentorClose" aria-label="关闭">×</button>
  </div>
  <div class="mentor-log" id="mentorLog"></div>
  <form class="mentor-form" id="mentorForm">
    <input id="mentorInput" type="text" autocomplete="off" placeholder="用自己的话说说卡在哪里……" maxlength="500">
    <button type="submit" class="dock-btn primary" id="mentorSend">发送</button>
  </form>
</aside>
<script>
// ---- src/engine.js ----
/* FunAl engine: a conversational, step-by-step tutoring runtime.
 *
 * Each screen is registered with FunAl.register({ id, title, goal, minutes, run(t) }).
 * `run` is an async function that talks to the learner through `t`:
 *
 *   await t.say('文字')                         tutor bubble (supports **bold**, `code`, line breaks)
 *   await t.ask.choice('问题', ['甲','乙'], {correct: 1, feedback: {0: '为什么甲不对'}, hints: [...]})
 *   await t.ask.predict('先猜猜', ['甲','乙'])   any answer accepted; returns index (use before a reveal)
 *   await t.ask.number('几种？', {answer: 5, feedback: v => v === 4 ? '差一点……' : null, hints: [...]})
 *   await t.ask.confirm('我数完了')              a single button
 *   const box = t.canvas()                       a card for custom widgets (DOM you build yourself)
 *   await t.waitFor(resolve => ...)              wait until your widget calls resolve(value)
 *   t.hints([...]) / t.clearHints()              hint ladder for a custom widget
 *   t.note('小结', '正文')                       highlighted callout
 *   t.learnerSays('文字')                        echo the learner's action as a right-side bubble
 *   t.record({kind, prompt, answer, correct})    log an answer for the recap and the AI mentor
 *   t.done()                                     screen complete; shows the "下一屏" button
 *
 * Everything the learner does is recorded in FunAl.state.log so the final screen can "look back".
 */
(function () {
  'use strict';

  const STORAGE_KEY = 'funal.dp.v1';
  const $ = (id) => document.getElementById(id);
  const screens = [];
  const state = { index: 0, completed: new Set(), log: [], attempts: [] };
  let current = null; // { screen, cancelled, prompt, hints, hintsShown }

  // ---------- utilities ----------
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function md(text) {
    return esc(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+?)`/g, '<code>$1</code>')
      .split(/\n\s*\n/).map((p) => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  }
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function scrollTo(node) {
    requestAnimationFrame(() => node.scrollIntoView({ behavior: 'smooth', block: 'end' }));
  }
  function addStyle(css) {
    const st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (s) {
        state.completed = new Set(s.completed || []);
        state.index = Math.min(s.index || 0, Math.max(0, screens.length - 1));
        state.log = Array.isArray(s.log) ? s.log : [];
      }
    } catch (e) { /* storage unavailable: run without memory */ }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        completed: [...state.completed], index: state.index, log: state.log.slice(-400),
      }));
    } catch (e) { /* ignore */ }
  }
  function reset() {
    state.completed = new Set(); state.index = 0; state.log = []; state.attempts = [];
    save();
    showScreen(0);
  }

  // ---------- registry ----------
  function register(screen) {
    if (!screen || !screen.id || typeof screen.run !== 'function') throw new Error('bad screen');
    screens.push(screen);
  }

  // ---------- chrome: topbar, toc, dock ----------
  function renderChrome() {
    const i = state.index;
    const s = screens[i];
    $('topbarTitle').textContent = s ? `${i + 1} / ${screens.length} · ${s.title}` : '';
    const prog = $('topbarProgress');
    prog.innerHTML = '';
    screens.forEach((sc, k) => {
      const d = el('span', 'dot' + (state.completed.has(sc.id) ? ' done' : '') + (k === i ? ' now' : ''));
      d.title = sc.title;
      prog.appendChild(d);
    });
    const toc = $('toc');
    toc.innerHTML = '';
    screens.forEach((sc, k) => {
      const b = el('button', (state.completed.has(sc.id) ? 'done' : '') + (k === i ? ' now' : ''));
      b.innerHTML = `<span class="n">${k + 1}</span><span>${esc(sc.title)}</span>`;
      b.addEventListener('click', () => { toggleToc(false); showScreen(k); });
      toc.appendChild(b);
    });
    const actions = el('div', 'toc-actions');
    const rb = el('button', '', '从头开始（清除进度）');
    rb.addEventListener('click', () => { if (confirm('清除已保存的进度，从第一屏重新开始？')) { toggleToc(false); reset(); } });
    actions.appendChild(rb);
    toc.appendChild(actions);
  }
  function toggleToc(force) {
    const toc = $('toc');
    const open = force != null ? force : toc.hidden;
    toc.hidden = !open;
    $('tocBtn').setAttribute('aria-expanded', String(open));
  }
  function setDock({ hint, next }) {
    const hb = $('hintBtn');
    const nb = $('nextBtn');
    hb.hidden = !hint;
    nb.hidden = !next;
    if (next) nb.textContent = next;
  }
  function updateHintButton() {
    const hb = $('hintBtn');
    if (!current || !current.hints || !current.hints.length) { hb.hidden = true; return; }
    hb.hidden = false;
    const left = current.hints.length - current.hintsShown;
    hb.disabled = left <= 0;
    hb.textContent = left > 0 ? (current.hintsShown === 0 ? '需要提示' : `再提示一点（还剩 ${left}）`) : '提示已用完';
  }
  function showHint() {
    if (!current || !current.hints) return;
    const k = current.hintsShown;
    if (k >= current.hints.length) return;
    current.hintsShown++;
    const b = el('div', 'bubble hint reveal', `<span class="hint-tag">提示 ${k + 1}</span>` + md(current.hints[k]));
    $('feed').appendChild(b);
    scrollTo(b);
    state.attempts.push({ screen: current.screen.id, kind: 'hint', n: k + 1, text: current.hints[k] });
    updateHintButton();
  }

  // ---------- tutor API ----------
  function makeTutor(run) {
    const feed = $('feed');
    const halted = () => new Promise(() => {}); // never resolves: stops a cancelled script
    const guard = () => (run.cancelled ? halted() : null);

    function append(node) { feed.appendChild(node); scrollTo(node); return node; }
    function setPrompt(prompt, hints) {
      run.prompt = prompt || run.prompt;
      run.hints = hints || [];
      run.hintsShown = 0;
      updateHintButton();
    }
    function clearPrompt() { run.hints = []; run.hintsShown = 0; updateHintButton(); }
    function record(entry) {
      const e = Object.assign({ screen: run.screen.id, t: Date.now() }, entry);
      state.log.push(e);
      state.attempts.push(e);
      save();
    }

    const t = {
      screen: run.screen,
      state,
      el, md, esc, addStyle, sleep,
      async say(text, opts = {}) {
        const g = guard(); if (g) return g;
        const b = append(el('div', 'bubble tutor reveal' + (opts.cls ? ' ' + opts.cls : ''), md(text)));
        await sleep(opts.pause == null ? 320 : opts.pause);
        if (run.cancelled) return halted();
        return b;
      },
      learnerSays(text) {
        if (run.cancelled) return null;
        return append(el('div', 'bubble learner reveal', md(text)));
      },
      right(text) { if (run.cancelled) return null; return append(el('div', 'bubble tutor right reveal', md(text))); },
      wrong(text) { if (run.cancelled) return null; return append(el('div', 'bubble tutor wrong reveal', md(text))); },
      /* A collapsible aside: curious learners open it, everyone else walks past. */
      aside(title, text) {
        if (run.cancelled) return null;
        const d = el('details', 'aside reveal');
        const sum = el('summary', '', esc(title));
        d.appendChild(sum);
        d.appendChild(el('div', 'aside-body', md(text)));
        d.addEventListener('toggle', () => { if (d.open) record({ kind: 'aside', prompt: title, answer: '展开了' }); });
        return append(d);
      },
      note(title, text) {
        if (run.cancelled) return null;
        return append(el('div', 'note reveal', (title ? `<div class="note-title">${esc(title)}</div>` : '') + md(text)));
      },
      html(html, cls) { if (run.cancelled) return null; return append(el('div', 'block reveal' + (cls ? ' ' + cls : ''), html)); },
      canvas(cls) { if (run.cancelled) return null; return append(el('div', 'canvas reveal' + (cls ? ' ' + cls : ''))); },
      hints(list) { setPrompt(null, list || []); },
      clearHints() { clearPrompt(); },
      record,
      pause(ms) { return run.cancelled ? halted() : sleep(ms); },
      waitFor(setup) {
        const g = guard(); if (g) return g;
        return new Promise((resolve) => setup((v) => { if (!run.cancelled) resolve(v); }));
      },
      ask: {
        /* After the hints run out and the learner is still stuck, let them out.
           Being trapped on one screen is the worst outcome in a single-page lesson. */
        offerWayOut(box, resolve, reveal) {
          if (box.querySelector('.way-out')) return;
          const row = el('div', 'btn-row reveal way-out');
          const b = el('button', 'btn', '卡住了，给我答案，继续往下');
          row.appendChild(b);
          b.addEventListener('click', () => {
            if (run.cancelled) return;
            row.remove();
            record({ kind: 'gave_up', prompt: run.prompt, answer: '看了答案' });
            reveal();
            clearPrompt();
            resolve();
          });
          box.parentNode.insertBefore(row, box.nextSibling);
        },
        /* Multiple choice with a correct answer. Resolves with the correct index once chosen. */
        async choice(prompt, options, opts = {}) {
          const g = guard(); if (g) return g;
          if (prompt) await t.say(prompt, { pause: 120 });
          const correct = Array.isArray(opts.correct) ? opts.correct : [opts.correct];
          setPrompt(prompt, opts.hints);
          const box = append(el('div', 'choices reveal'));
          let missed = 0;
          return new Promise((resolve) => {
            options.forEach((label, i) => {
              const b = el('button', '', md(label));
              b.addEventListener('click', async () => {
                if (run.cancelled) return;
                t.learnerSays(label);
                const ok = correct.includes(i);
                record({ kind: 'choice', prompt, answer: label, correct: ok });
                if (ok) {
                  b.classList.add('right');
                  box.querySelectorAll('button').forEach((x) => (x.disabled = true));
                  clearPrompt();
                  if (opts.explainRight) t.right(typeof opts.explainRight === 'function' ? opts.explainRight(i) : opts.explainRight);
                  resolve(i);
                } else {
                  b.classList.add('wrong');
                  b.disabled = true;
                  /* feedback may be a function of the index, or an object keyed by index
                     (with an optional `default`). A screen that supplies neither is a bug:
                     say so loudly in the console rather than showing an empty platitude. */
                  let fb = null;
                  if (typeof opts.feedback === 'function') fb = opts.feedback(i);
                  else if (opts.feedback) fb = opts.feedback[i] != null ? opts.feedback[i] : opts.feedback.default;
                  if (typeof fb === 'function') fb = fb(i);
                  if (!fb) {
                    console.warn(`[FunAl] no diagnosis for wrong answer ${i} of "${prompt}"`);
                    fb = '这个选项不对。回到上面的画面，对着数字再看一遍。';
                  }
                  t.wrong(fb);
                  if (++missed >= (run.hints.length || 0) + 2) {
                    t.ask.offerWayOut(box, () => resolve(correct[0]), () => {
                      const right = box.querySelectorAll('button')[correct[0]];
                      if (right) right.classList.add('right');
                      box.querySelectorAll('button').forEach((x) => (x.disabled = true));
                      if (opts.explainRight) t.right(typeof opts.explainRight === 'function' ? opts.explainRight(correct[0]) : opts.explainRight);
                    });
                  }
                }
              });
              box.appendChild(b);
            });
          });
        },
        /* Prediction: every answer is accepted. Resolves with the chosen index. */
        async predict(prompt, options, opts = {}) {
          const g = guard(); if (g) return g;
          if (prompt) await t.say(prompt, { pause: 120 });
          setPrompt(prompt, opts.hints);
          const box = append(el('div', 'choices reveal'));
          return new Promise((resolve) => {
            options.forEach((label, i) => {
              const b = el('button', '', md(label));
              b.addEventListener('click', () => {
                if (run.cancelled) return;
                t.learnerSays(label);
                record({ kind: 'predict', prompt, answer: label });
                b.classList.add('picked');
                box.querySelectorAll('button').forEach((x) => (x.disabled = true));
                clearPrompt();
                resolve(i);
              });
              box.appendChild(b);
            });
          });
        },
        /* Integer answer. opts.feedback(v) may return a diagnosis string for a specific wrong value. */
        async number(prompt, opts = {}) {
          const g = guard(); if (g) return g;
          if (prompt) await t.say(prompt, { pause: 120 });
          setPrompt(prompt, opts.hints);
          let missed = 0;
          const row = append(el('div', 'numask reveal'));
          const input = el('input');
          input.type = 'number'; input.inputMode = 'numeric'; input.placeholder = opts.placeholder || '填一个数字';
          if (opts.min != null) input.min = opts.min;
          const unit = el('span', 'unit', esc(opts.unit || ''));
          const btn = el('button', 'btn primary', opts.button || '确定');
          row.append(input, unit, btn);
          setTimeout(() => input.focus({ preventScroll: true }), 80);
          const free = opts.answer == null;              // a free prediction: any integer is accepted
          const accepted = Array.isArray(opts.answer) ? opts.answer : [opts.answer];
          return new Promise((resolve) => {
            const submit = () => {
              if (run.cancelled) return;
              const raw = input.value.trim();
              if (raw === '' || !/^-?\d+$/.test(raw)) { input.focus(); return; }
              const v = Number(raw);
              t.learnerSays(String(v) + (opts.unit || ''));
              const ok = free || accepted.includes(v);
              record({ kind: 'number', prompt, answer: v, correct: free ? undefined : ok });
              if (ok) {
                input.disabled = true; btn.disabled = true;
                clearPrompt();
                if (opts.explainRight) t.right(typeof opts.explainRight === 'function' ? opts.explainRight(v) : opts.explainRight);
                resolve(v);
              } else {
                let fb = opts.feedback ? opts.feedback(v) : null;
                if (!fb) fb = opts.defaultFeedback || `不是 ${v}。别急着猜，回到上面的画面，一个一个数。`;
                t.wrong(fb);
                input.value = ''; input.focus();
                if (++missed >= (run.hints.length || 0) + 2) {
                  t.ask.offerWayOut(row, () => resolve(accepted[0]), () => {
                    input.value = String(accepted[0]);
                    input.disabled = true; btn.disabled = true;
                    if (opts.explainRight) t.right(typeof opts.explainRight === 'function' ? opts.explainRight(accepted[0]) : opts.explainRight);
                    else t.right(`答案是 **${accepted[0]}${opts.unit || ''}**。别卡在这儿，往下走，后面还会再用到它。`);
                  });
                }
              }
            };
            btn.addEventListener('click', submit);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
          });
        },

        /* Multiple-select: the learner ticks several options, then submits. */
        async multi(prompt, options, opts = {}) {
          const g = guard(); if (g) return g;
          if (prompt) await t.say(prompt, { pause: 120 });
          setPrompt(prompt, opts.hints);
          const want = (opts.correct || []).slice().sort().join(',');
          let missed = 0;
          const box = append(el('div', 'choices reveal'));
          const picked = new Set();
          const btns = options.map((label, i) => {
            const b = el('button', 'multi', md(label));
            b.addEventListener('click', () => {
              if (run.cancelled || b.disabled) return;
              if (picked.has(i)) { picked.delete(i); b.classList.remove('picked'); }
              else { picked.add(i); b.classList.add('picked'); }
              submit.disabled = picked.size === 0;
            });
            box.appendChild(b);
            return b;
          });
          const row = append(el('div', 'btn-row reveal'));
          const submit = el('button', 'btn primary', opts.button || '就选这些');
          submit.disabled = true;
          row.appendChild(submit);
          return new Promise((resolve) => {
            submit.addEventListener('click', () => {
              if (run.cancelled) return;
              const got = [...picked].sort();
              t.learnerSays(got.length ? got.map((i) => options[i]).join('、') : '一个都不选');
              const ok = got.join(',') === want;
              record({ kind: 'multi', prompt, answer: got.map((i) => options[i]).join('、'), correct: ok });
              if (ok) {
                btns.forEach((b, i) => { b.disabled = true; if (picked.has(i)) b.classList.add('right'); });
                submit.remove();
                clearPrompt();
                if (opts.explainRight) t.right(opts.explainRight);
                resolve(got);
              } else {
                const fb = opts.feedback ? opts.feedback(got) : null;
                t.wrong(fb || '这一组不对。看看漏了哪个，或者多选了哪个。');
                if (++missed >= (run.hints.length || 0) + 2) {
                  t.ask.offerWayOut(row, () => resolve((opts.correct || []).slice()), () => {
                    btns.forEach((x, i) => { x.disabled = true; x.classList.toggle('right', (opts.correct || []).includes(i)); x.classList.toggle('picked', (opts.correct || []).includes(i)); });
                    submit.remove();
                    if (opts.explainRight) t.right(opts.explainRight);
                  });
                }
              }
            });
          });
        },
        /* Put shuffled cards into the right order by tapping them one at a time. */
        async order(prompt, items, opts = {}) {
          const g = guard(); if (g) return g;
          if (prompt) await t.say(prompt, { pause: 120 });
          setPrompt(prompt, opts.hints);
          const shuffled = opts.shuffled || items.map((_, i) => i).slice().reverse();
          let missed = 0;
          const wrap = append(el('div', 'order reveal'));
          const slots = el('div', 'order-slots');
          const pool = el('div', 'order-pool');
          wrap.append(slots, pool);
          let next = 0;
          const btns = shuffled.map((idx) => {
            const b = el('button', 'order-card', md(items[idx]));
            b.addEventListener('click', () => {
              if (run.cancelled || b.disabled) return;
              if (idx !== next) {
                b.classList.add('shake');
                setTimeout(() => b.classList.remove('shake'), 320);
                const fb = opts.feedback ? opts.feedback(idx, next) : null;
                t.wrong(fb || `这一句不是现在该放的。先想想：在做这一句之前，你必须先知道什么？`);
                record({ kind: 'order', prompt, answer: items[idx], correct: false });
                if (++missed >= (run.hints.length || 0) + 2) {
                  t.ask.offerWayOut(wrap, () => resolve_(true), () => {
                    while (next < items.length) {
                      const slot = el('div', 'order-slot');
                      slot.innerHTML = `<span class="n">${next + 1}</span>` + md(items[next]);
                      slots.appendChild(slot);
                      next++;
                    }
                    pool.innerHTML = '';
                    if (opts.explainRight) t.right(opts.explainRight);
                  });
                }
                return;
              }
              b.disabled = true;
              b.classList.add('placed');
              const slot = el('div', 'order-slot');
              slot.innerHTML = `<span class="n">${next + 1}</span>` + md(items[idx]);
              slots.appendChild(slot);
              b.remove();
              next++;
              if (next === items.length) {
                record({ kind: 'order', prompt, answer: '顺序全对', correct: true });
                clearPrompt();
                if (opts.explainRight) t.right(opts.explainRight);
                resolve_(true);
              }
            });
            pool.appendChild(b);
            return b;
          });
          let resolve_;
          return new Promise((r) => { resolve_ = r; });
        },
        /* Match each term on the left to the thing the learner actually did, on the right. */
        async match(prompt, pairs, opts = {}) {
          const g = guard(); if (g) return g;
          if (prompt) await t.say(prompt, { pause: 120 });
          setPrompt(prompt, opts.hints);
          const wrap = append(el('div', 'match reveal'));
          const leftCol = el('div', 'match-col');
          const rightCol = el('div', 'match-col');
          wrap.append(leftCol, rightCol);
          const rightOrder = opts.rightOrder || pairs.map((_, i) => i).slice().reverse();
          let sel = null, done = 0, missed = 0;
          const lefts = pairs.map((p, i) => {
            const b = el('button', 'match-card', md(p.term));
            b.addEventListener('click', () => {
              if (run.cancelled || b.disabled) return;
              if (sel) sel.classList.remove('sel');
              sel = b; b.classList.add('sel');
              rightCol.querySelectorAll('button:not(:disabled)').forEach((r) => r.classList.add('armed'));
            });
            b.dataset.i = i;
            leftCol.appendChild(b);
            return b;
          });
          rightOrder.forEach((i) => {
            const p = pairs[i];
            const b = el('button', 'match-card', md(p.did));
            b.addEventListener('click', () => {
              if (run.cancelled || b.disabled || !sel) return;
              const li = Number(sel.dataset.i);
              if (li !== i) {
                b.classList.add('shake');
                setTimeout(() => b.classList.remove('shake'), 320);
                const fb = opts.feedback ? opts.feedback(pairs[li].term, p.did) : null;
                t.wrong(fb || `「${pairs[li].term}」说的不是这件事。再看看你到底在哪一屏做过这个动作。`);
                record({ kind: 'match', prompt, answer: pairs[li].term + ' → ' + p.did, correct: false });
                if (++missed >= (run.hints.length || 0) + 3) {
                  t.ask.offerWayOut(wrap, () => resolveAll(true), () => {
                    leftCol.querySelectorAll('button').forEach((x) => { x.disabled = true; x.classList.add('right'); x.classList.remove('sel'); });
                    rightCol.querySelectorAll('button').forEach((x) => { x.disabled = true; x.classList.add('right'); x.classList.remove('armed'); });
                    const lines = pairs.map((q) => `**${q.term.replace(/\*/g, '')}** → ${q.did}`).join('\n\n');
                    t.note('正确的对应', lines);
                  });
                }
                return;
              }
              sel.disabled = true; sel.classList.remove('sel'); sel.classList.add('right');
              b.disabled = true; b.classList.add('right');
              rightCol.querySelectorAll('button').forEach((r) => r.classList.remove('armed'));
              sel = null;
              record({ kind: 'match', prompt, answer: p.term + ' → ' + p.did, correct: true });
              if (p.explain) t.right(p.explain);
              if (++done === pairs.length) { clearPrompt(); resolveAll(true); }
            });
            rightCol.appendChild(b);
          });
          let resolveAll;
          return new Promise((r) => { resolveAll = r; });
        },
        /* A single button the learner presses when ready. */
        async confirm(label, opts = {}) {
          const g = guard(); if (g) return g;
          const row = append(el('div', 'btn-row reveal'));
          const b = el('button', 'btn ' + (opts.cls || 'primary'), esc(label));
          row.appendChild(b);
          return new Promise((resolve) => {
            b.addEventListener('click', () => {
              if (run.cancelled) return;
              b.disabled = true;
              if (opts.echo !== false) { row.remove(); t.learnerSays(label); }
              resolve(true);
            });
          });
        },
      },
      /* Look back at what the learner answered earlier (used by the recap screen). */
      recall(filter) {
        return state.log.filter((e) => {
          if (!filter) return true;
          if (filter.screen && e.screen !== filter.screen) return false;
          if (filter.kind && e.kind !== filter.kind) return false;
          if (filter.promptIncludes && !(e.prompt || '').includes(filter.promptIncludes)) return false;
          return true;
        });
      },
      recallOne(filter) { const l = t.recall(filter); return l.length ? l[l.length - 1] : null; },
      done(opts = {}) {
        if (run.cancelled) return;
        state.completed.add(run.screen.id);
        state.index = screens.indexOf(run.screen);
        save();
        renderChrome();
        const isLast = state.index >= screens.length - 1;
        const next = screens[state.index + 1];
        setDock({ hint: false, next: opts.label || (isLast ? '回到目录' : `下一屏：${next.title}`) });
        clearPrompt();
      },
    };
    return t;
  }

  // ---------- screen lifecycle ----------
  async function showScreen(i) {
    if (i < 0 || i >= screens.length) return;
    if (current) current.cancelled = true;
    const screen = screens[i];
    state.index = i;
    save();
    const run = { screen, cancelled: false, prompt: '', hints: [], hintsShown: 0 };
    current = run;
    const feed = $('feed');
    feed.innerHTML = '';
    window.scrollTo({ top: 0 });
    renderChrome();
    setDock({ hint: false, next: null });
    const t = makeTutor(run);
    try {
      await screen.run(t);
    } catch (err) {
      if (!run.cancelled) {
        console.error(err);
        feed.appendChild(el('div', 'bubble tutor error', md(`这一屏出了点技术问题（${esc(err.message || err)}）。你可以打开目录跳到下一屏，然后把这个问题告诉作者。`)));
        setDock({ hint: false, next: i + 1 < screens.length ? `下一屏：${screens[i + 1].title}` : null });
        state.completed.add(screen.id);
      }
    }
  }

  // ---------- AI mentor (optional; only when served by mentor_server.py) ----------
  const Mentor = {
    available: false,
    history: [],
    async init() {
      try {
        const r = await fetch('api/mentor/health', { cache: 'no-store' });
        const j = await r.json();
        this.available = !!j.ai;
      } catch (e) { this.available = false; }
      $('mentorBtn').hidden = !this.available;
    },
    context() {
      const sc = current ? current.screen : null;
      return {
        screen_id: sc ? sc.id : null,
        screen_title: sc ? sc.title : null,
        screen_goal: sc ? sc.goal || null : null,
        current_prompt: current ? current.prompt : null,
        hints_available: current ? current.hints : [],
        hints_shown: current ? current.hintsShown : 0,
        recent_attempts: state.attempts.slice(-6).map((a) => ({ kind: a.kind, prompt: a.prompt, answer: a.answer, correct: a.correct, n: a.n })),
      };
    },
    async ask(question) {
      const res = await fetch('api/mentor', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, context: this.context(), history: this.history.slice(-8) }),
      });
      const j = await res.json();
      if (!res.ok || j.error) throw new Error(j.error || ('HTTP ' + res.status));
      this.history.push({ role: 'user', content: question }, { role: 'assistant', content: j.reply });
      return j.reply;
    },
  };
  function wireMentor() {
    const sheet = $('mentor');
    const log = $('mentorLog');
    const addM = (cls, text) => { const m = el('div', 'm ' + cls, md(text)); log.appendChild(m); log.scrollTop = log.scrollHeight; return m; };
    $('mentorBtn').addEventListener('click', () => {
      sheet.hidden = !sheet.hidden;
      if (!sheet.hidden) {
        if (!log.childElementCount) addM('sys', '说说你卡在哪里。导师只会反问和提示，答案还是你自己找到的。');
        $('mentorInput').focus();
      }
    });
    $('mentorClose').addEventListener('click', () => { sheet.hidden = true; });
    $('mentorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('mentorInput');
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      addM('me', q);
      state.attempts.push({ screen: current ? current.screen.id : null, kind: 'mentor_question', text: q });
      const wait = addM('sys', '导师在想……（它会先想一会儿，大约十几秒）');
      $('mentorSend').disabled = true;
      try {
        const reply = await Mentor.ask(q);
        wait.remove();
        addM('ai', reply);
      } catch (err) {
        wait.remove();
        addM('sys', `导师暂时联系不上（${esc(err.message)}）。先用页面底部的“需要提示”。`);
      } finally {
        $('mentorSend').disabled = false;
        input.focus();
      }
    });
  }

  // ---------- boot ----------
  function start() {
    load();
    renderChrome();
    $('tocBtn').addEventListener('click', () => toggleToc());
    document.addEventListener('click', (e) => {
      const toc = $('toc');
      if (!toc.hidden && !toc.contains(e.target) && e.target !== $('tocBtn')) toggleToc(false);
    });
    $('hintBtn').addEventListener('click', showHint);
    $('nextBtn').addEventListener('click', () => {
      if (state.index + 1 < screens.length) showScreen(state.index + 1);
      else { toggleToc(true); }
    });
    wireMentor();
    Mentor.init();
    showScreen(state.index);
  }

  window.FunAl = { register, start, showScreen, state, screens, el, md, esc, addStyle, sleep, Mentor };
})();

FunAl.data = {

  ways: {

  /* ---- problem 2: cheapest way up a toll staircase (6 stairs, the ground is free) ----

   *   walking greedily (18), dodging the priciest stair (16), and the table (12).
   * The cheapest route has to step on the most expensive stair, and it is the only
   * route that costs 12. The answer avoids 5, 8, 13, 21 so it cannot be mistaken for
   * one of the counting answers. */
  toll: {
    tolls: [0, 1, 7, 8, 7, 1, 2],          // tolls[i] = 踩上第 i 级要付的钱
    pricey: 3,                             // 全场最贵的那一级
    best: [0, 1, 7, 9, 14, 10, 12],        // best[i] = 到第 i 级最少花多少
    from: [null, 0, 0, 1, 2, 3, 5],        // from[i] = 最省时是从第几级来的
    bestPath: [0, 1, 3, 5, 6],
    bestCost: 12,

    root.appendChild(row);

    const pathRow = el('div', 'w-path');

    const api = {
      el: root, steps, pos: o.start, path: [], visited: [o.start], cost: 0, enabled: true,
      onStep(fn) { listeners.push(fn); return api; },
      render() {
        steps.forEach((s, i) => {
          s.classList.toggle('current', i === api.pos);
          s.classList.toggle('visited', api.visited.includes(i) && i !== api.pos);
        });
        if (fig.parentNode) fig.parentNode.removeChild(fig);
        steps[api.pos].appendChild(fig);
        pathRow.innerHTML = '';
        if (api.path.length) {
          pathRow.appendChild(el('span', '', '走法：'));

            pathRow.appendChild(el('span', 'chip' + (k === 2 ? ' two' : ''), `+${k}`));

      enable(v) { api.enabled = v !== false; api.render(); },

    const row = el('div', 'w-cells-row');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'w-links');
    root.appendChild(svg);
    const items = [];
    const vals = {};
    for (let i = 0; i <= o.n; i++) {
      const c = el('div', 'w-cell');
      const v = el('div', 'w-cell-val empty', esc(o.placeholder));
      c.appendChild(v);
      c.appendChild(el('div', 'w-cell-idx', esc(o.label(i))));
      const sub = el('div', 'w-cell-sub', o.sub ? esc(o.sub(i)) : '');
      c.appendChild(sub);
      row.appendChild(c);
      items.push({ c, v, sub });
    }
    root.appendChild(row);
    container.appendChild(outer);

    const api = {
      el: outer, items,
      get(i) { return vals[i]; },
      set(i, value, cls) {
        vals[i] = value;
        const v = items[i].v;
        v.innerHTML = esc(String(value));
        v.classList.remove('empty', 'active', 'given', 'filled', 'good', 'gold', 'src');
        v.classList.add(cls || 'filled');
      },
      mark(i, cls) { items[i].v.classList.add(cls); },
      unmark(i, cls) { items[i].v.classList.remove(cls); },
      clearMarks(cls) { items.forEach((it) => it.v.classList.remove(...(cls ? [cls] : ['active', 'good', 'gold', 'src']))); },
      setSub(i, text) { items[i].sub.textContent = text; },
      links(i, preds, labels) {
        api.clearLinks();
        const rr = root.getBoundingClientRect();
        const to = items[i].v.getBoundingClientRect();
        const tx = to.left - rr.left + to.width / 2, ty = to.top - rr.top;
        preds.forEach((p, k) => {
          if (p < 0 || p > o.n) return;
          const from = items[p].v.getBoundingClientRect();
          const fx = from.left - rr.left + from.width / 2, fy = from.top - rr.top;
          const lift = 22 + Math.abs(i - p) * 8;
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${fx} ${fy} C ${fx} ${fy - lift}, ${tx} ${ty - lift}, ${tx} ${ty}`);
          path.dataset.from = p;
          svg.appendChild(path);
          if (labels && labels[k] != null) {
            const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            t.setAttribute('x', (fx + tx) / 2); t.setAttribute('y', ty - lift + 2); t.setAttribute('text-anchor', 'middle');
            t.textContent = labels[k];
            svg.appendChild(t);
          }
        });
      },
      markLink(from, cls) { svg.querySelectorAll('path').forEach((p) => { if (Number(p.dataset.from) === from) p.classList.add(cls); }); },
      clearLinks() { svg.innerHTML = ''; },
      /* Let the learner click cells; pass null to switch it off. */
      pickable(fn) {
        items.forEach((it, i) => {
          it.v.classList.toggle('pick-me', !!fn);
          it.v.onclick = fn ? () => fn(i, it) : null;
        });
      },
      /* Loop until the learner types the right integer into cell i. */
      fill(i, opts2) {
        const f = Object.assign({ answer: null, onWrong: null, onRight: null, button: '填上' }, opts2);
        const v = items[i].v;
        v.classList.remove('empty'); v.classList.add('active');
        v.innerHTML = '';
        const input = el('input');
        input.type = 'number'; input.inputMode = 'numeric'; input.placeholder = '?';
        v.appendChild(input);
        const okRow = el('div', 'w-cell-ok');
        const ok = el('button', 'btn primary', f.button);
        okRow.appendChild(ok);
        items[i].c.appendChild(okRow);
        setTimeout(() => input.focus({ preventScroll: true }), 60);
        const accepted = Array.isArray(f.answer) ? f.answer : [f.answer];
        return new Promise((resolve) => {
          const submit = () => {
            const raw = input.value.trim();
            if (!/^-?\d+$/.test(raw)) { input.focus(); return; }
            const n = Number(raw);
            if (f.answer == null || accepted.includes(n)) {
              okRow.remove();
              api.set(i, n, 'good');
              if (f.onRight) f.onRight(n);
              resolve(n);
            } else {
              input.value = '';
              input.focus();
              v.classList.add('bad-flash');
              setTimeout(() => v.classList.remove('bad-flash'), 400);
              if (f.onWrong) f.onWrong(n);
            }
          };
          ok.addEventListener('click', submit);
          input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
        });
      },
    };
    Object.keys(o.values).forEach((k) => api.set(Number(k), o.values[k], 'given'));
    return api;
  }

  /* ---------------- route chips ---------------- */
  function routeChips(container, routes, opts) {
    const o = Object.assign({ onClick: null, format: (r) => (Array.isArray(r) ? r.map((k) => `+${k}`).join(' ') : String(r)) }, opts);
    const root = el('div', 'w-chips');
    container.appendChild(root);
    const api = {
      el: root, chips: [],
      add(route, cls) {
        const ch = el('div', 'w-chip new' + (cls ? ' ' + cls : '') + (o.onClick ? ' btn-like' : ''), esc(o.format(route)));
        if (o.onClick) ch.addEventListener('click', () => o.onClick(route, ch));
        root.appendChild(ch); api.chips.push(ch);
        return ch;
      },
      clear() { root.innerHTML = ''; api.chips = []; },
    };
    (routes || []).forEach((r) => api.add(r));
    return api;
  }


  /* ---------------- recursion tree ---------------- */
  /* nodes are "问题卡"; the learner clicks one to split it into its sub-questions.
     opts: { root, children(n) -> [subs] or null for a leaf, leafValue(n), label(n),
             memo: bool (offer "查账本" when a value is known), book: notebook api } */
  function tree(container, opts) {
    const o = Object.assign({ root: 6, label: (n) => `到第 ${n} 级？`, children: (n) => (n <= 1 ? null : [n - 1, n - 2]),
      leafValue: () => 1, memo: false, book: null, hud: true, autoLeaf: true }, opts);
    const root = el('div', 'w-tree');
    const hud = el('div', 'w-tree-hud');
    const inner = el('div', 'w-tree-inner');
    if (o.hud) container.appendChild(hud);
    root.appendChild(inner);
    container.appendChild(root);

    const seen = new Map();      // value -> times this question has appeared
    const listeners = [];
    let opened = 0, dupCount = 0, computed = 0, lookups = 0, cards = 0;
    const computedSet = new Set();   // which distinct questions were actually worked out
    const pending = [];   // nodes the learner has not opened yet

    function hudRender() {
      if (!o.hud) return;
      hud.innerHTML = '';
      const add = (label, v, cls) => { const d = el('div', cls || '', `${esc(label)} <b>${typeof v === 'number' ? v.toLocaleString('en-US') : v}</b>`); hud.appendChild(d); };
      if (o.hudLabels) { o.hudLabels(add, { opened, dupCount, computed, lookups, cards, distinctComputed: computedSet.size }); return; }
      add('屏幕上的问题卡：', cards);
      if (!o.memo) add('其中是重复的：', dupCount);
      else { add('真正算过的小题：', computedSet.size); add('直接抄账本：', lookups); }
    }

    function makeNode(n, depth) {
      cards++;
      const node = el('div', 'w-node');
      const box = el('div', 'w-node-box', esc(o.label(n)));
      node.appendChild(box);
      const times = (seen.get(n) || 0) + 1;
      seen.set(n, times);
      const kidsOf = o.children(n);
      const known = o.book && o.book.get(n) != null;
      const state = { n, node, box, expanded: false, value: null };

      if (!kidsOf) {                                  // a leaf: answer is obvious
        state.value = o.leafValue(n);
        box.classList.add('leaf');
        box.innerHTML = esc(o.label(n) + ' = ' + state.value);
        return state;
      }
      if (times > 1 && !o.memo) { box.classList.add('dup'); dupCount++; }
      if (o.memo && known) box.classList.add('cached');
      box.classList.add('can');
      pending.push(state);
      box.onclick = () => {
        if (state.expanded) return;
        if (o.memo && o.book && o.book.get(n) != null) {   // take it from the notebook
          state.expanded = true;
          state.value = o.book.get(n);
          box.classList.remove('can'); box.classList.add('cached');
          box.innerHTML = esc(o.label(n) + ' = ' + state.value) + ' <span class="small">（抄的）</span>';
          lookups++; hudRender();
          listeners.forEach((f) => f({ kind: 'lookup', n, value: state.value, api }));
          if (state.parent) settle(state.parent);   // an answer copied from the book still counts upward
          return;
        }
        state.expanded = true;
        opened++;
        box.classList.remove('can');
        const kidsWrap = el('div', 'w-node-kids');
        state.kids = kidsOf.map((k) => {
          const w = el('div', 'w-node-kid');
          const child = makeNode(k, depth + 1);
          child.parent = state;
          w.appendChild(child.node);
          kidsWrap.appendChild(w);
          return child;
        });
        node.appendChild(kidsWrap);
        computed++;
        computedSet.add(n);
        hudRender();
        settle(state);
        listeners.forEach((f) => f({ kind: 'open', n, api }));
      };
      return state;
    }

    /* when every child of a node has a value, the node gets one too (and goes into the book) */
    function settle(state) {
      if (!state.kids || state.value != null) return;
      if (state.kids.some((k) => k.value == null)) return;
      state.value = state.kids.reduce((a, k) => a + k.value, 0);
      state.box.classList.add('solved');
      state.box.innerHTML = esc(o.label(state.n) + ' = ' + state.value);
      if (o.book) o.book.set(state.n, state.value);
      listeners.forEach((f) => f({ kind: 'solved', n: state.n, value: state.value, api }));
      if (state.parent) settle(state.parent);
    }

    const rootState = makeNode(o.root, 0);
    inner.appendChild(rootState.node);
    hudRender();

    const api = {
      el: root, rootState,
      on(fn) { listeners.push(fn); return api; },
      get stats() { return { opened, dupCount, computed, lookups, cards, distinct: seen.size, distinctComputed: computedSet.size }; },
      /* Open every remaining card at once, for learners who have felt enough of the tedium. */
      expandAll(limit) {
        let guard = limit || 4000;
        while (guard-- > 0) {
          const next = root.querySelector('.w-node-box.can');
          if (!next) break;
          next.click();
        }
        hudRender();
        return api.stats;
      },
      get remaining() { return root.querySelectorAll('.w-node-box.can').length; },
      get value() { return rootState.value; },
      allOpened() {
        const walk = (s) => (s.kids ? s.kids.every(walk) : true) && (s.value != null);
        return walk(rootState);
      },
      scrollRight() { root.scrollLeft = root.scrollWidth; },
    };
    return api;
  }

  /* ---------------- buckets (tap card, then tap bucket: works on phones) ---------------- */
  function buckets(container, opts) {
    const o = Object.assign({ cards: [], buckets: [], answer: () => 0, format: (c) => String(c),
      onWrong: null, onRight: null, onDone: null, poolLabel: '把下面的卡片一张张分进两个筐：' }, opts);
    const root = el('div', 'w-buckets');
    if (o.poolLabel) root.appendChild(el('div', 'small muted', esc(o.poolLabel)));
    const pool = el('div', 'w-bucket-pool');
    root.appendChild(pool);
    const row = el('div', 'w-bucket-row');
    const bs = o.buckets.map((b, i) => {
      const box = el('div', 'w-bucket');
      box.appendChild(el('div', 'w-bucket-title', esc(b) + ' <span class="cnt">（0 张）</span>'));
      const items = el('div', 'w-bucket-items');
      box.appendChild(items);
      box.onclick = () => place(i);
      row.appendChild(box);
      return { box, items, count: 0, cards: [] };
    });
    root.appendChild(row);
    container.appendChild(root);

    let selected = null;
    let placed = 0;
    const cardEls = o.cards.map((c, i) => {
      const e = el('div', 'w-card', o.format(c));
      e.onclick = () => {
        if (e.classList.contains('in')) return;
        if (selected) selected.el.classList.remove('sel');
        selected = { c, el: e, i };
        e.classList.add('sel');
        bs.forEach((b) => b.box.classList.add('armed'));
      };
      pool.appendChild(e);
      return e;
    });

    function place(bi) {
      if (!selected) return;
      const want = o.answer(selected.c, selected.i);
      if (want !== bi) {
        selected.el.classList.add('shake');
        setTimeout(() => selected && selected.el.classList.remove('shake'), 320);
        if (o.onWrong) o.onWrong(selected.c, bi, want);
        return;
      }
      const e = selected.el;
      e.classList.remove('sel'); e.classList.add('in');
      bs[bi].items.appendChild(e);
      bs[bi].count++;
      bs[bi].cards.push(selected.c);
      bs[bi].box.querySelector('.cnt').textContent = `（${bs[bi].count} 张）`;
      bs.forEach((b) => b.box.classList.remove('armed'));
      const done = ++placed === o.cards.length;
      if (o.onRight) o.onRight(selected.c, bi, done);
      selected = null;
      if (done && o.onDone) o.onDone(bs.map((b) => b.cards));
    }

    return {
      el: root, buckets: bs,
      counts() { return bs.map((b) => b.count); },
      cutTails(cls) { cardEls.forEach((e) => e.classList.add(cls || 'cut')); },
      highlight(bi, cls) { bs[bi].box.classList.add(cls || 'armed'); },
    };
  }

  /* ---------------- notebook / 账本 ---------------- */
  function notebook(container, opts) {
    const o = Object.assign({ title: '账本', rows: [], label: (k) => `到第 ${k} 级`, empty: '还没记' }, opts);
    const root = el('div', 'w-book');
    root.appendChild(el('div', 'w-book-title', esc(o.title)));
    const map = {};
    const rows = {};
    o.rows.forEach((k) => {
      const r = el('div', 'w-book-row empty');
      r.appendChild(el('span', '', esc(o.label(k))));
      r.appendChild(el('span', 'v', esc(o.empty)));
      root.appendChild(r);
      rows[k] = r;
    });
    container.appendChild(root);
    return {
      el: root,
      get(k) { return map[k]; },
      set(k, v) {
        map[k] = v;
        const r = rows[k];
        if (!r) return;
        r.classList.remove('empty');
        r.classList.add('fresh');
        r.querySelector('.v').textContent = String(v);
        setTimeout(() => r.classList.remove('fresh'), 400);
      },
      clear() { Object.keys(map).forEach((k) => { delete map[k]; const r = rows[k]; if (r) { r.classList.add('empty'); r.querySelector('.v').textContent = o.empty; } }); },
      size() { return Object.keys(map).length; },
    };
  }

  FunAl.widgets = { stairs, cells, routeChips, person, tree, buckets, notebook };
})();

FunAl.register({
  id: 'hook',
  title: '先押一个数',
  goal: '让学习者知道这门课要干什么，并留下一个属于自己的猜测，供后面对账。',
  minutes: 2,
  async run(t) {
    t.html(`<div class="title-card">
      <h1>动态规划，从一段楼梯开始</h1>
      <p class="sub">不背公式。你会亲手算出每一个数字，最后再给你做过的事起名字。</p>

    await t.say('这个动作有个名字，叫**动态规划**。名字听着吓人，其实你今天就能自己把它做出来。');

    const box = t.canvas();

// ---- src/levels/02_count.js ----
FunAl.register({
  id: 'count4',
  title: '亲手数一数',
  goal: '让学习者亲手枚举出到第 4 级的 5 条走法，并确认「顺序不同就是不同走法」。',
  minutes: 3,
  async run(t) {
    const D = FunAl.data.ways;
    await t.say('楼梯缩短到 **4 级**。同样的规则：每次上 1 级或 2 级。');
    await t.say('先说清楚一件事，不然后面全乱。');

    await t.ask.choice('先走 1 级、再走 1 级、最后走 2 级（1+1+2），和先走 2 级、再走两次 1 级（2+1+1）——算同一种走法，还是两种？', [
      '算两种。脚步的先后顺序不一样。',
      '算一种。反正都是两个 1 和一个 2。',
    ], {
      correct: 0,
      feedback: {
        1: '想象你真的在爬这段楼梯：一种是先小步小步走、最后一大步跨上去；另一种是一上来就跨一大步。你的脚落在的台阶都不一样——第一种踩了第 1、2、4 级，第二种踩了第 2、3、4 级。踩过的台阶都不同，当然是两种走法。',
      },
      explainRight: '对。**一种走法 = 一整趟脚步的先后顺序。** 顺序不同就是不同的走法。',
      hints: [
        '别想公式，想你的脚。这两种走法，你的脚踩过的台阶一样吗？',
        '第一种（1+1+2）踩了第 1、2、4 级。第二种（2+1+1）踩了第 2、3、4 级。',
      ],
    });

    await t.say('好，现在你去数。走到第 4 级，每走成一趟，右边就多一张卡片。**走出重复的会被退回来。**');

    const box = t.canvas();
    const st = FunAl.widgets.stairs(box, { n: 4, controls: true, emptyHint: '从地面出发。' });
    const found = [];
    const chipBox = t.canvas();
    chipBox.innerHTML = '<div class="small muted" style="margin-bottom:8px">已经找到的走法</div>';
    const chips = FunAl.widgets.routeChips(chipBox, []);
    const counter = t.el('div', 'small muted', '已找到 0 条');
    chipBox.appendChild(counter);

    let resolveDone;
    const doneP = new Promise((r) => { resolveDone = r; });
    const claimRow = t.el('div', 'btn-row');
    const claimBtn = t.el('button', 'btn primary', '我找全了');
    claimRow.appendChild(claimBtn);
    chipBox.appendChild(claimRow);

    st.onStep((ev) => {
      if (!ev.done) return;
      const key = ev.path.join('');
      if (found.some((f) => f.join('') === key)) {
        chips.chips[found.findIndex((f) => f.join('') === key)].classList.add('dup');
        setTimeout(() => chips.chips.forEach((c) => c.classList.remove('dup')), 900);
        t.wrong(`**${ev.path.map((k) => '+' + k).join(' ')}** 这条你已经走过了，看右边第 ${found.findIndex((f) => f.join('') === key) + 1} 张卡。换一条没走过的。`);
      } else {
        found.push(ev.path.slice());
        chips.add(ev.path.slice());
        counter.textContent = `已找到 ${found.length} 条`;
      }
      setTimeout(() => st.reset(), 700);
    });

    t.hints([
      '还没走过的组合里，试试一上来就跨 2 级。',
      '把你找到的卡片按「第一步走了几级」看一眼：第一步走 1 级的有几条？走 2 级的有几条？',
      '第一步走 1 级的有 3 条，第一步走 2 级的有 2 条。',
    ]);

    claimBtn.addEventListener('click', () => {
      if (found.length === D.table[4]) {
        claimBtn.disabled = true;
        t.clearHints();
        resolveDone(true);
      } else if (found.length < D.table[4]) {
        const have = found.map((f) => f.join(''));
        const missing = D.routes4.filter((r) => !have.includes(r.join('')));
        const withOneTwo = missing.filter((r) => r.filter((k) => k === 2).length === 1);
        let why;
        if (missing.some((r) => r.every((k) => k === 2))) why = '你试过**全程都跨 2 级**吗？两大步就到顶了。';
        else if (missing.some((r) => r.every((k) => k === 1))) why = '你试过**一级一级慢慢走**吗？四小步。';
        else if (withOneTwo.length) why = `含一个 2 级的走法一共有 **3 条**：那一大步可以迈在开头、中间、结尾。你现在有 ${3 - withOneTwo.length} 条，还差 ${withOneTwo.length} 条。`;
        else why = '再回去走走看。';
        t.wrong(`你找到了 ${found.length} 条，还差 ${missing.length} 条。${why}`);
      }
    });
    await doneP;

    t.learnerSays(`我找全了，一共 ${found.length} 条`);
    t.right(`**${D.table[4]} 条，一条不多一条不少。** 这是你自己一条条走出来的，不是谁告诉你的。`);

    await t.say('把它们摆在一起看看：');
    const allBox = t.canvas();
    FunAl.widgets.routeChips(allBox, D.routes4);

    await t.ask.predict('那到第 6 级呢？先猜猜，也是这样一条条数的话，你觉得要数多少条？', [
      '十几条吧',
      '几十条',
